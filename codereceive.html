<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警衛室即時看板 (V2)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #E8F5E9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; color: #333; }
        
        /* 隱藏輸入框，但保留位置以免瀏覽器優化掉焦點 */
        #scannerInput { opacity: 0; position: absolute; top: -9999px; }

        .container { background-color: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); width: 95%; max-width: 1200px; display: flex; flex-direction: column; gap: 15px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #E8F5E9; padding-bottom: 10px; }
        h1 { font-size: 1.8em; margin: 0; color: #1B5E20; }
        .loading-bar { background: #fff3cd; color: #856404; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9em; }
        .loading-bar.ready { background: #d4edda; color: #155724; }
        
        #alert-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; width: 100%; }
        .alert-item { padding: 8px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; height: 95px; position: relative; line-height: 1.2; text-align: left; }
        .alert-item.newest { background: #fff3e0; border: 3px solid #ff5722; animation: flash 1.5s infinite; transform: scale(1.02); z-index: 10; }
        .alert-item.normal { background: #f5f5f5; border: 1px solid #bdbdbd; }
        .placeholder { background: #fdfdfd; border: 1px dashed #A5D6A7; color: #ccc; align-items: center; justify-content: center; font-size: 1.2em; display: flex; }
        @keyframes flash { 0%,100% { border-color:#ff5722; } 50% { border-color:#ffccbc; } }
        
        .delete-btn { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; background: rgba(255,255,255,0.8); border-radius: 50%; text-align: center; cursor: pointer; color: #aaa; font-weight: bold; }
        .delete-btn:hover { background: #d84315; color: white; }
        .alert-message .student-name { color: #388E3C; font-size: 1.2em; font-weight: bold; display: block; margin-bottom: 2px; }
        .alert-message .status { color: #d84315; font-size: 0.9em; font-weight: bold; }
        .alert-time { font-size: 0.8em; color: #777; margin-top: 3px; display: block; }
        
        .controls { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding-top: 15px; border-top: 2px solid #eee; }
        .controls button { border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; color: white; }
        #btn-export { background: #00796b; } #btn-clear { background: #FF9800; }
        
        /* 彈窗 */
        #scanOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); z-index: 999; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.2s; backdrop-filter: blur(4px); }
        #scanOverlay.show { opacity: 1; visibility: visible; }
        .overlay-card { background: white; padding: 40px 50px; border-radius: 20px; text-align: center; transform: scale(0.8); transition: 0.2s; min-width: 350px; }
        #scanOverlay.show .overlay-card { transform: scale(1); }
        .overlay-card.success { border: 8px solid #28a745; background: #f0fff4; color: #155724; }
        .overlay-card.error { border: 8px solid #dc3545; background: #fff5f5; color: #721c24; }
        .overlay-card .icon { font-size: 5em; display: block; margin-bottom: 10px; }
        .overlay-card .main-text { font-size: 3em; font-weight: 900; margin: 10px 0; }
        .overlay-card .sub-text { font-size: 1.6em; background: #333; color: white; padding: 8px 30px; border-radius: 50px; display: inline-block; margin-top: 15px; }

        @media (max-width: 1024px) { #alert-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { #alert-grid { grid-template-columns: 1fr; } .container { width: 90%; } }
    </style>
</head>
<body>
    <input type="text" id="scannerInput" autocomplete="off" />
    
    <audio id="scanSound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>
    <audio id="errorSound" src="https://www.soundjay.com/buttons/beep-05.mp3"></audio>

    <div id="scanOverlay"><div id="overlayCard" class="overlay-card"><span class="icon" id="overlayIcon"></span><div class="main-text" id="overlayMainText"></div><div class="sub-text" id="overlaySubText"></div></div></div>

    <div class="container">
        <div class="header-bar"><h1>警衛室即時看板</h1><div id="loadingStatus" class="loading-bar">⏳ 下載名單中...</div></div>
        <div id="alert-grid"></div>
        <div class="controls">
            <div style="margin-right:auto;color:#888;font-weight:bold;">● 系統運作中</div>
            <button id="btn-export" onclick="exportReport()">匯出報表</button>
            <button id="btn-clear" onclick="clearLocalScreen()">清除畫面</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyB_-fHCMhi-URwyBqzAIipmffWwvNgzJJc", authDomain: "qr-scanner-app-2c73d.firebaseapp.com", databaseURL: "https://qr-scanner-app-2c73d-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "qr-scanner-app-2c73d", storageBucket: "qr-scanner-app-2c73d.firebasestorage.app", messagingSenderId: "385628927398", appId: "1:385628927398:web:00239f1b2acebd6e790b67" };
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const alertsRef = database.ref("alerts");
        let alertHistory = [], allStudents = [], isDataReady = false, overlayTimer = null, isLocked = false, lockTimer = null;

        document.addEventListener('DOMContentLoaded', () => {
            setupAlertListener(); fetchStudentList(); setupScannerInput(); keepFocus();
            document.addEventListener('click', () => setTimeout(keepFocus, 200));
        });

        // --- 核心修改：採用您建議的注音對照表 ---
        const bopomofoToKey = {
            'ㄅ': '1', 'ㄆ': 'q', 'ㄇ': 'a', 'ㄈ': 'z',
            'ㄉ': '2', 'ㄊ': 'w', 'ㄋ': 's', 'ㄌ': 'x',
            'ˇ': '3', 'ㄍ': 'e', 'ㄎ': 'd', 'ㄏ': 'c',
            'ˋ': '4', 'ㄐ': 'r', 'ㄑ': 'f', 'ㄒ': 'v',
            'ㄓ': '5', 'ㄔ': 't', 'ㄕ': 'g', 'ㄖ': 'b',
            'ˊ': '6', 'ㄗ': 'y', 'ㄘ': 'h', 'ㄙ': 'n',
            '˙': '7', 'ㄧ': 'u', 'ㄨ': 'j', 'ㄩ': 'm',
            'ㄚ': '8', 'ㄛ': 'i', 'ㄜ': 'k', 'ㄝ': ',',
            'ㄞ': '9', 'ㄟ': 'o', 'ㄠ': 'l', 'ㄡ': '.',
            'ㄢ': '0', 'ㄣ': 'p', 'ㄤ': ';', 'ㄥ': '/',
            'ㄦ': '-', '？': '/', '，': ',', '。': '.',
            '－': '-', '＝': '=', '（': '(', '）': ')' // 補一些全形符號
        };

        function fixBopomofoInput(input) {
            let result = '';
            for (let char of input) {
                // 如果是對照表裡的注音，就換成英文/數字；否則保留原字
                result += bopomofoToKey[char] || char;
            }
            // 轉大寫並去空白，確保 "q123" 也能對應到 "Q123"
            return result.toUpperCase().trim();
        }

        function setupScannerInput() {
            const input = document.getElementById('scannerInput');
            
            // 監聽 Enter 鍵 (標準掃描槍行為)
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    // ★ 這裡不管有沒有在組字，直接抓值！
                    let rawVal = this.value;
                    
                    // 馬上清空，準備下一次掃描
                    this.value = '';
                    
                    if (rawVal) {
                        // 1. 先修復注音亂碼
                        let fixedVal = fixBopomofoInput(rawVal);
                        console.log(`原始: ${rawVal} -> 修正: ${fixedVal}`);
                        
                        // 2. 處理資料
                        processScan(fixedVal);
                    }
                }
            });
            
            // 監聽組字結束 (雙重保險，防止注音模式 Enter 被吃掉)
            input.addEventListener('compositionend', function(e) {
                let rawVal = this.value;
                this.value = '';
                if (rawVal) {
                    let fixedVal = fixBopomofoInput(rawVal);
                    processScan(fixedVal);
                }
            });

            input.addEventListener('blur', () => setTimeout(keepFocus, 100));
        }

        function keepFocus() { document.getElementById('scannerInput').focus(); }

        // --- 掃描處理邏輯 ---
        function processScan(idRaw) {
            if(isLocked) return;
            if(!isDataReady) return showOverlay('error', '名單下載中...', '');
            
            // 確保只取 ID 部分 (如 "136-林煦峰" -> "136")
            let id = idRaw.split('-')[0].trim();
            
            // 搜尋學生 (支援 id 或 學號 欄位)
            let s = allStudents.find(i => String(i.id||i['學號']||'') === id);
            
            if(s) {
                document.getElementById('scanSound').play().catch(()=>{});
                let cls = s['班級']||s['class']||s['className']||"(未分班)";
                let name = s['姓名']||s['name']||"未知";
                
                showOverlay('success', name, cls);
                
                // 1. 寫入 GAS 日誌
                fetch(GOOGLE_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({type:'scan', content:`${name} (${cls})`}) }).catch(e=>console.error(e));
                
                // 2. 推送 Firebase (給老師看)
                let safeClass = cls.trim(); 
                let path = safeClass ? `queues/${safeClass}` : `queues/unknown`;
                database.ref(path).push({ id:id, name:name, class:safeClass, timestamp:new Date().toISOString(), status:'waiting' });

                // 防連點
                isLocked = true; clearTimeout(lockTimer); lockTimer = setTimeout(()=>isLocked=false, 1000);
            } else {
                document.getElementById('errorSound').play().catch(()=>{});
                showOverlay('error', '查無此人', id);
                isLocked = true; clearTimeout(lockTimer); lockTimer = setTimeout(()=>isLocked=false, 1000);
            }
        }

        // --- 顯示功能 (維持原樣) ---
        function setupAlertListener() {
            alertsRef.limitToLast(15).on('child_added', s => { alertHistory.push({key:s.key, ...s.val()}); renderGrid(); });
            alertsRef.on('child_removed', s => { alertHistory = alertHistory.filter(i => i.key !== s.key); renderGrid(); });
            alertsRef.on('value', s => { if(!s.exists()) { alertHistory=[]; renderGrid(); }});
        }
        function renderGrid() {
            const grid = document.getElementById('alert-grid'); grid.innerHTML = '';
            const list = alertHistory.slice(-15).reverse();
            for(let i=0; i<15; i++) {
                const item = list[i]; const cell = document.createElement('div');
                if(item) {
                    cell.className = i===0 ? 'alert-item newest' : 'alert-item normal';
                    cell.innerHTML = `<div class="delete-btn" onclick="deleteAlert('${item.key}')">×</div><div class="alert-message"><span class="student-name">${maskName(item.name)} (${item.class||''})</span><span class="status">${item.status}</span></div><span class="alert-time">${new Date(item.timestamp).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</span>`;
                } else { cell.className = 'alert-item placeholder'; cell.textContent = '---'; }
                grid.appendChild(cell);
            }
        }
        function fetchStudentList() {
            document.getElementById('loadingStatus').textContent = "⏳ 下載中...";
            fetch(`${GOOGLE_SCRIPT_URL}?op=students`).then(r=>r.json()).then(d=>{ allStudents=d; isDataReady=true; document.getElementById('loadingStatus').textContent=`✅ 已更新 (${d.length}人)`; document.getElementById('loadingStatus').classList.add('ready'); }).catch(()=>{document.getElementById('loadingStatus').textContent="❌ 失敗";});
        }
        function deleteAlert(k) { if(confirm("刪除？")) alertsRef.child(k).remove(); keepFocus(); }
        function clearLocalScreen() { if(confirm("清除？")) { alertHistory=[]; renderGrid(); keepFocus(); } }
        function exportReport() { if(!alertHistory.length) return alert("無資料"); let csv = "\uFEFF時間,班級,姓名,狀態\n" + alertHistory.slice().reverse().map(i => `${new Date(i.timestamp).toLocaleString() },${i.class},${i.name},${i.status}`).join("\n"); let a = document.createElement('a'); a.href = encodeURI("data:text/csv;charset=utf-8,"+csv); a.download = `報表_${new Date().toISOString().slice(0,10)}.csv`; a.click(); keepFocus(); }
        function maskName(n) { return n? (n.length<=2 ? n[0]+"O" : n[0]+"O".repeat(n.length-2)+n.slice(-1)) : ""; }
        function showOverlay(type, t1, t2) { const el = document.getElementById('scanOverlay'); const card = document.getElementById('overlayCard'); if(type==='success') { card.className='overlay-card success'; document.getElementById('overlayIcon').textContent='✅'; document.getElementById('overlayMainText').textContent=`${t1} ${t2}`; document.getElementById('overlaySubText').textContent='已通知班級'; } else { card.className='overlay-card error'; document.getElementById('overlayIcon').textContent='⚠️'; document.getElementById('overlayMainText').textContent=t1; document.getElementById('overlaySubText').textContent=t2; } el.classList.add('show'); clearTimeout(overlayTimer); overlayTimer = setTimeout(()=>el.classList.remove('show'), 3000); }
    </script>
</body>
</html>
