<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警衛室整合系統 (大字版)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans TC', Arial, sans-serif; 
            background-color: #E8F5E9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            min-height: 100vh; 
            margin: 0; 
            padding: 10px 0;
            color: #333; 
            box-sizing: border-box;
        }

        #scannerInput { position: absolute; top: -1000px; opacity: 0; } 

        .container { 
            text-align: center; 
            background-color: #ffffff; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1); 
            width: 95%; 
            max-width: 1200px; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 95vh; /* 盡量佔滿畫面 */
        }

        h1 { 
            font-size: 1.8em; 
            margin: 0; 
            color: #1B5E20; 
            border-bottom: 2px solid #E8F5E9;
            padding-bottom: 5px;
        }

        /* --- 上半部：顯示區 (15格) --- */
        #alert-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 10px;
            width: 100%;
        }

        .alert-item {
            padding: 5px;
            border-radius: 8px;
            text-align: left;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1.2; 
            height: 90px; /* 高度縮小一點，留空間給下方大字 */
            position: relative; 
            transition: all 0.3s ease;
        }

        .alert-item.newest {
            background-color: #fff3e0;
            border: 3px solid #ff5722;
            animation: flash-border 1.5s infinite;
            z-index: 10;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.3);
        }

        .alert-item.normal {
            background-color: #f5f5f5;
            border: 1px solid #bdbdbd;
        }

        .placeholder {
            background-color: #fdfdfd;
            border: 1px dashed #A5D6A7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #ccc;
            height: 90px;
        }

        @keyframes flash-border {
            0% { border-color: #ff5722; box-shadow: 0 0 5px rgba(255, 87, 34, 0.5); }
            50% { border-color: #ffccbc; box-shadow: 0 0 15px rgba(255, 87, 34, 0.8); }
            100% { border-color: #ff5722; box-shadow: 0 0 5px rgba(255, 87, 34, 0.5); }
        }

        .delete-btn {
            position: absolute; top: 2px; right: 2px;
            width: 20px; height: 20px; line-height: 20px; 
            text-align: center; font-size: 14px; font-weight: bold;
            color: #aaa; background-color: rgba(255,255,255,0.8);
            border-radius: 50%; cursor: pointer;
        }
        .delete-btn:hover { background-color: #d84315; color: white; }

        .alert-message { font-size: 0.9em; color: #333; font-weight: bold; }
        .alert-message .student-name { color: #388E3C; display: block; font-size: 1.2em; margin-bottom: 2px; }
        .alert-message .status { color: #d84315; font-size: 0.9em; }
        .alert-time { font-size: 0.8em; color: #777; margin-top: 2px; display: block; }

        /* --- 下半部：大字掃描區 --- */
        .bottom-section {
            flex-grow: 1; /* 佔滿剩餘空間 */
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 核心修改：巨大顯示區 */
        .big-display-area {
            flex-grow: 1;
            background: #f8f9fa;
            border: 4px dashed #bdc3c7;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            min-height: 200px;
        }
        
        .big-display-area.success { background-color: #d4edda; border: 4px solid #28a745; color: #155724; }
        .big-display-area.error { background-color: #f8d7da; border: 4px solid #dc3545; color: #721c24; }

        /* 姓名超大字 */
        .scan-main-text {
            font-size: 5em; /* 超大 */
            font-weight: 900;
            line-height: 1.2;
            margin: 0;
        }
        
        /* 班級或狀態副標題 */
        .scan-sub-text {
            font-size: 2em;
            margin-top: 10px;
            background: #333;
            color: #fff;
            padding: 5px 20px;
            border-radius: 50px;
        }
        
        /* 一般狀態下的副標題樣式 */
        .big-display-area:not(.success):not(.error) .scan-sub-text {
            background: transparent;
            color: #888;
            font-size: 1.5em;
        }

        .controls {
            display: flex; justify-content: space-between; align-items: center;
        }
        .controls button {
            color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1em;
        }
        #btn-clear-local { background-color: #FF9800; }
        #btn-export { background-color: #00796b; }
        
        .loading-bar { width: 100%; background: #fff3cd; color: #856404; padding: 5px; border-radius: 4px; font-size: 0.9em; }
        .loading-bar.ready { background: #d4edda; color: #155724; }

        /* RWD */
        @media (max-width: 1024px) {
            #alert-grid { grid-template-columns: repeat(3, 1fr); }
            .scan-main-text { font-size: 3.5em; }
        }
        @media (max-width: 600px) {
            .container { padding: 10px; width: 98%; height: auto; }
            #alert-grid { grid-template-columns: 1fr; }
            .scan-main-text { font-size: 2.5em; }
        }
    </style>
</head>
<body>

    <input type="password" id="scannerInput" autocomplete="off" />

    <audio id="scanSound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>
    <audio id="errorSound" src="https://www.soundjay.com/buttons/beep-05.mp3"></audio>

    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
            <h1>警衛室即時看板</h1>
            <div id="loadingStatus" class="loading-bar" style="width:auto; padding:5px 15px;">⏳ 下載名單中...</div>
        </div>

        <div id="alert-grid"></div>

        <div class="bottom-section">
            <div id="displayArea" class="big-display-area">
                <div id="mainText" class="scan-main-text">請掃描條碼</div>
                <div id="subText" class="scan-sub-text">準備就緒</div>
            </div>

            <div class="controls">
                <button id="btn-export" onclick="exportReport()">匯出報表</button>
                <button id="btn-clear-local" onclick="clearLocalScreen()">清除畫面資料</button>
            </div>
        </div>
    </div>

    <script>
        // --- 設定 ---
        const firebaseConfig = {
          apiKey: "AIzaSyB_-fHCMhi-URwyBqzAIipmffWwvNgzJJc",
          authDomain: "qr-scanner-app-2c73d.firebaseapp.com",
          databaseURL: "https://qr-scanner-app-2c73d-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "qr-scanner-app-2c73d",
          storageBucket: "qr-scanner-app-2c73d.firebasestorage.app",
          messagingSenderId: "385628927398",
          appId: "1:385628927398:web:00239f1b2acebd6e790b67"
        };
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const alertsRef = database.ref("alerts");
        const queuesRef = database.ref("queues");
        
        const MAX_ALERTS = 15; 
        let alertHistory = []; 
        let allStudents = [];
        let isDataReady = false;
        let isLocked = false;

        document.addEventListener('DOMContentLoaded', () => {
            setupAlertListener();
            fetchStudentList();
            setupScannerInput();
            keepFocus();
            document.addEventListener('click', () => setTimeout(keepFocus, 200));
        });

        // --- 顯示功能 (Grid) ---
        function setupAlertListener() {
            alertsRef.limitToLast(MAX_ALERTS).on('child_added', (snapshot) => {
                const alertData = snapshot.val();
                alertData.key = snapshot.key; 
                alertHistory.push(alertData); 
                renderGrid(); 
            });
            alertsRef.on('value', (snapshot) => {
                if (!snapshot.exists()) { alertHistory = []; renderGrid(); }
            });
            alertsRef.on('child_removed', (snapshot) => {
                alertHistory = alertHistory.filter(item => item.key !== snapshot.key);
                renderGrid();
            });
            renderGrid();
        }

        function maskName(n) {
            if (!n) return "";
            if (n.length <= 1) return n;
            if (n.length === 2) return n.substring(0, 1) + "O";
            let masked = n.substring(0, 1);
            masked += "O".repeat(n.length - 2);
            masked += n.substring(n.length - 1);
            return masked;
        }

        function renderGrid() {
            const gridElement = document.getElementById('alert-grid');
            gridElement.innerHTML = ''; 
            const itemsToDisplay = alertHistory.slice(-MAX_ALERTS).reverse();

            for (let i = 0; i < MAX_ALERTS; i++) {
                const item = itemsToDisplay[i];
                const cell = document.createElement('div');
                if (item) {
                    cell.className = (i === 0) ? 'alert-item newest' : 'alert-item normal';
                    const localTime = new Date(item.timestamp).toLocaleString('zh-TW', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
                    cell.innerHTML = `
                        <div class="delete-btn" onclick="deleteAlert('${item.key}')">×</div>
                        <div class="alert-message">
                            <span class="student-name">${maskName(item.name)} (${item.class})</span>
                            <span class="status">${item.status}</span>
                        </div>
                        <span class="alert-time">${localTime}</span>
                    `;
                } else {
                    cell.className = 'alert-item placeholder';
                    cell.textContent = '---'; 
                }
                gridElement.appendChild(cell);
            }
        }

        function deleteAlert(key) {
            if (!confirm("刪除此訊息？")) return;
            if (key) alertsRef.child(key).remove();
            keepFocus(); 
        }

        function clearLocalScreen() {
            if (!confirm("清除畫面資料？")) return;
            alertHistory = [];
            renderGrid();
            keepFocus();
        }

        function exportReport() {
            if (alertHistory.length === 0) return alert("無資料");
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF時間,班級,姓名,狀態\r\n";
            [...alertHistory].reverse().forEach(item => {
                const time = new Date(item.timestamp).toLocaleString('zh-TW');
                csvContent += `"${time}","${item.class}","${item.name}","${item.status}"\r\n`;
            });
            const link = document.createElement("a");
            link.href = encodeURI(csvContent);
            link.download = `報表_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            keepFocus();
        }

        // --- 掃描功能 (Scanner) ---
        function fetchStudentList() {
            const statusEl = document.getElementById('loadingStatus');
            fetch(`${GOOGLE_SCRIPT_URL}?op=students`)
                .then(res => res.json())
                .then(data => {
                    allStudents = data;
                    isDataReady = true;
                    statusEl.textContent = `✅ 已更新 (${data.length}人)`;
                    statusEl.classList.add('ready');
                })
                .catch(err => { statusEl.textContent = "❌ 下載失敗"; });
        }

        function setupScannerInput() {
            const input = document.getElementById('scannerInput');
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    let content = this.value.trim();
                    this.value = ''; 
                    if (content.length > 0) processScan(fixGarbledInput(content));
                }
            });
            input.addEventListener('blur', () => setTimeout(keepFocus, 100));
        }

        function keepFocus() { document.getElementById('scannerInput').focus(); }

        function fixGarbledInput(str) {
            const map = {'ㄅ':'1', 'ㄉ':'2', 'ˇ':'3', 'ˋ':'4', 'ㄓ':'5', 'ˊ':'6', '˙':'7', 'ㄚ':'8', 'ㄞ':'9', 'ㄢ':'0', 'ㄦ':'-'};
            let fixedStr = '';
            for (let char of str) fixedStr += map[char] || char;
            return fixedStr;
        }

        function processScan(rawInput) {
            if (isLocked) return;
            if (!isDataReady) return alert("名單下載中...");

            const searchId = rawInput.split('-')[0].trim();
            const student = allStudents.find(s => String(s.id) === searchId);

            if (student) {
                playAudio('scanSound');
                // 顯示大字
                updateDisplay("success", student.name, student.className);
                
                pushToFirebaseQueue(student.name, student.className, searchId);
                logToGAS(student.name, student.className);
                
                isLocked = true;
                setTimeout(() => { resetDisplay(); isLocked = false; }, 3000);
            } else {
                playAudio('errorSound');
                updateDisplay("error", "查無此人", searchId);
                isLocked = true;
                setTimeout(() => { resetDisplay(); isLocked = false; }, 1500);
            }
        }

        // --- 核心：大字顯示切換 ---
        function updateDisplay(type, mainText, subText) {
            const area = document.getElementById('displayArea');
            const main = document.getElementById('mainText');
            const sub = document.getElementById('subText');

            area.className = "big-display-area " + type;
            main.textContent = mainText;
            sub.textContent = subText;
        }

        function resetDisplay() {
            const area = document.getElementById('displayArea');
            const main = document.getElementById('mainText');
            const sub = document.getElementById('subText');

            area.className = "big-display-area";
            main.textContent = "請掃描條碼";
            sub.textContent = "準備就緒";
        }

        function pushToFirebaseQueue(name, className, id) {
            const targetPath = (className && className !== "(未分班)") ? `queues/${className}` : `queues/unknown`;
            database.ref(targetPath).push().set({
                id: id, name: name, studentName: name, 
                className: className, timestamp: new Date().toISOString(), status: 'waiting'
            });
        }

        function logToGAS(name, className) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST", body: JSON.stringify({ type: 'scan', content: `${name} (${className})` }),
                headers: { "Content-Type": "text/plain" }
            }).catch(e => console.error("Log error", e));
        }

        function playAudio(id) {
            const audio = document.getElementById(id);
            if (audio) audio.play().catch(e => {});
        }
    </script>
</body>
</html>
