<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警衛室掃描監控站 (修復版)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans TC', Arial, sans-serif; 
            background-color: #E8F5E9; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; padding: 20px;
            box-sizing: border-box;
        }

        /* 隱藏輸入框，使用 password 類型作為第一道防線 */
        #scannerInput { position: absolute; top: -1000px; opacity: 0; } 

        .main-container {
            background-color: white; padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center;
            width: 90%; max-width: 800px; border: 2px solid #e0e0e0;
            margin-bottom: 20px;
        }

        .header-status {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 10px; background: #f1f8e9; border-radius: 10px;
        }
        
        #dataStatus { font-weight: bold; color: #e67e22; }

        .monitor-area {
            width: 100%; height: 200px; background: #000; color: #fff;
            display: flex; justify-content: center; align-items: center;
            border-radius: 10px; margin-bottom: 20px;
            font-size: 1.2rem;
        }

        /* 彈出式訊息卡片 */
        .overlay-card {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            background: white; padding: 40px; border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center; opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100; border: 4px solid #ccc;
        }
        .overlay-card.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .overlay-card.success { border-color: #2ecc71; background: #f0fff4; }
        .overlay-card.error { border-color: #e74c3c; background: #fff5f5; }

        .overlay-icon { font-size: 5rem; display: block; margin-bottom: 10px; }
        .overlay-main { font-size: 2.5rem; font-weight: 900; color: #333; margin: 10px 0; }
        .overlay-sub { font-size: 1.5rem; color: #666; font-weight: bold; }
        .class-badge { background: #333; color: white; padding: 5px 15px; border-radius: 8px; font-size: 1.2rem; }

        .btn-reload { padding: 8px 16px; background: #95a5a6; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <input type="password" id="scannerInput" autocomplete="off" />

    <div class="main-container">
        <div class="header-status">
            <h2>💂 警衛室掃描站</h2>
            <div id="dataStatus">⏳ 下載名單中...</div>
            <button class="btn-reload" onclick="location.reload()">🔄 重整</button>
        </div>

        <div class="monitor-area">
            ( 監視器畫面整合區 )
        </div>

        <div style="color: #666;">
            請確保游標點擊畫面任意處即可開始掃描<br>
            <span style="font-size:0.8em; color:#999;">支援：中文輸入法自動修正、斷線快取</span>
        </div>
    </div>

    <div id="resultOverlay" class="overlay-card">
        <span class="overlay-icon"></span>
        <div class="overlay-main"></div>
        <div class="overlay-sub"></div>
    </div>

    <audio id="scanSound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>
    <audio id="errorSound" src="https://www.soundjay.com/buttons/beep-05.mp3"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB_-fHCMhi-URwyBqzAIipmffWwvNgzJJc",
            authDomain: "qr-scanner-app-2c73d.firebaseapp.com",
            databaseURL: "https://qr-scanner-app-2c73d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "qr-scanner-app-2c73d",
            storageBucket: "qr-scanner-app-2c73d.firebasestorage.app",
            messagingSenderId: "385628927398",
            appId: "1:385628927398:web:00239f1b2acebd6e790b67"
        };
        
        // ★★★ GAS 網址 ★★★
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allStudents = [];
        let isDataReady = false;
        let overlayTimer = null;

        // --- 1. 網頁載入：下載學生名單 ---
        window.onload = function() {
            keepFocus();
            fetchStudentList();
        };

        function fetchStudentList() {
            const statusEl = document.getElementById('dataStatus');
            // 使用 op=students 取得學生清單
            fetch(`${GOOGLE_SCRIPT_URL}?op=students`)
                .then(res => res.json())
                .then(data => {
                    allStudents = data;
                    isDataReady = true;
                    statusEl.innerHTML = `✅ 連線正常 (共 ${data.length} 人)`;
                    statusEl.style.color = "#27ae60";
                    console.log("名單下載完成", data);
                })
                .catch(err => {
                    statusEl.innerHTML = "❌ 連線失敗，請檢查網路";
                    statusEl.style.color = "#c0392b";
                });
        }

        // --- 2. 確保輸入框聚焦 ---
        const input = document.getElementById('scannerInput');
        function keepFocus() { input.focus(); }
        document.addEventListener('click', keepFocus);
        input.addEventListener('blur', () => setTimeout(keepFocus, 100));

        // --- 3. 掃描輸入監聽 ---
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                let content = this.value.trim();
                this.value = ''; 
                if (content.length > 0) {
                    // ★ 強制修復中文亂碼 (1變ㄅ)
                    content = fixGarbledInput(content);
                    processScan(content);
                }
            }
        });

        // --- 4. 處理掃描邏輯 ---
        function processScan(rawInput) {
            if (!isDataReady) {
                showOverlay("error", "載入中...", "請稍候再試");
                return;
            }

            // 解析 ID (取 - 前面的數字)
            const searchId = rawInput.split('-')[0].trim();
            console.log("查詢ID:", searchId);

            // 本機查表
            // 注意：確保 id 比對時都轉成字串
            const student = allStudents.find(s => String(s.id) === searchId);

            if (student) {
                // A. 成功：顯示 UI
                playAudio('scanSound');
                showOverlay("success", student.name, student.className);
                
                // B. ★ 優先寫入 Firebase (讓廣播先響)
                pushToFirebaseQueue(student.name, student.className, searchId);
                
                // C. 最後才寫入 GAS (這可能會失敗，但不會卡住 Firebase)
                logToGAS(student.name, student.className);

            } else {
                // 失敗
                playAudio('errorSound');
                showOverlay("error", "查無此人", `ID: ${searchId}`);
            }
        }

        // --- 工具：修復中文亂碼 ---
        function fixGarbledInput(str) {
            const map = {
                'ㄅ': '1', 'ㄉ': '2', 'ˇ': '3', 'ˋ': '4', 'ㄓ': '5',
                'ˊ': '6', '˙': '7', 'ㄚ': '8', 'ㄞ': '9', 'ㄢ': '0',
                'ㄦ': '-' 
            };
            let fixedStr = '';
            for (let char of str) fixedStr += map[char] || char;
            return fixedStr;
        }

        // --- 核心：寫入 Firebase ---
        function pushToFirebaseQueue(name, className, id) {
            // 防呆：如果班級空白，預設為 unknown
            const safeClass = (className && className !== "(未分班)") ? className : "unknown";
            const targetPath = `queues/${safeClass}`;
            
            console.log(`[Firebase] 寫入: ${targetPath}, 學生: ${name}`);

            database.ref(targetPath).push().set({
                id: id,
                name: name,
                studentName: name,
                className: className, // 讓看板用
                class: className,     // 雙重保險
                timestamp: new Date().toISOString(),
                status: 'waiting'
            }).catch(e => {
                console.error("Firebase 寫入錯誤:", e);
                alert("Firebase 連線失敗，請檢查網路狀態");
            });
        }

        // --- 核心：寫入 GAS 日誌 ---
        function logToGAS(name, className) {
            // 因為不能改 code.gs，我們直接傳字串給它紀錄
            // 使用 fire-and-forget (不等待回應)，避免卡頓
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({
                    type: 'scan',
                    content: `${name} (${className})`
                }),
                headers: { "Content-Type": "text/plain" }
            }).then(res => {
                // 成功發送
                console.log("已發送至日誌");
            }).catch(e => {
                // 失敗也沒關係，Firebase 已經寫入了
                console.error("日誌寫入失敗 (可能是格式問題)", e);
            });
        }

        // --- UI 顯示 ---
        function showOverlay(type, mainText, subText) {
            const overlay = document.getElementById('resultOverlay');
            const icon = overlay.querySelector('.overlay-icon');
            const main = overlay.querySelector('.overlay-main');
            const sub = overlay.querySelector('.overlay-sub');

            overlay.className = `overlay-card ${type} show`;
            
            if (type === 'success') {
                icon.textContent = "✅";
                main.textContent = mainText;
                sub.innerHTML = `<span class="class-badge">${subText}</span>`;
            } else {
                icon.textContent = "❌";
                main.textContent = mainText;
                sub.textContent = subText;
            }

            // 3秒後自動消失
            if (overlayTimer) clearTimeout(overlayTimer);
            overlayTimer = setTimeout(() => {
                overlay.classList.remove('show');
            }, 3000);
        }

        function playAudio(id) {
            document.getElementById(id).play().catch(()=>{});
        }
    </script>
</body>
</html>
