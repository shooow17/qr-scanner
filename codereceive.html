<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警衛室監控站 (完美修復版)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans TC', Arial, sans-serif; 
            background-color: #E8F5E9; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; padding: 20px;
            box-sizing: border-box;
        }

        #scannerInput { position: absolute; top: -1000px; opacity: 0; } 

        .container { 
            text-align: center; 
            background-color: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1); 
            width: 90%; 
            max-width: 1000px; 
            position: relative;
        }

        h1 { font-size: 2.2em; color: #2E7D32; margin-bottom: 10px; }
        
        .status-bar {
            background: #f1f8e9; padding: 10px; border-radius: 8px;
            margin-bottom: 20px; font-weight: bold; color: #e67e22;
        }

        /* 監控畫面設定 */
        .monitor-frame {
            width: 100%;
            height: 400px; 
            background-color: #2c3e50;
            border: 4px solid #333;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #bdc3c7;
            font-size: 1.2rem;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        .monitor-placeholder { text-align: center; }

        /* 彈出視窗 */
        .overlay-card {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            background: white; padding: 40px; border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center; opacity: 0; pointer-events: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100; border: 5px solid #ccc; min-width: 300px;
        }
        .overlay-card.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .overlay-card.success { border-color: #2ecc71; background: #f0fff4; }
        .overlay-card.error { border-color: #e74c3c; background: #fff5f5; }

        .overlay-icon { font-size: 5rem; display: block; margin-bottom: 10px; }
        .overlay-main { font-size: 2.5rem; font-weight: 900; color: #333; margin: 10px 0; }
        .overlay-sub { font-size: 1.5rem; color: #666; font-weight: bold; }
        .class-badge { background: #333; color: white; padding: 5px 15px; border-radius: 8px; }

        .btn-reload { padding: 8px 16px; background: #95a5a6; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <input type="password" id="scannerInput" autocomplete="off" />

    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>💂 警衛室掃描監控站</h1>
            <button class="btn-reload" onclick="location.reload()">🔄 重整</button>
        </div>
        
        <div id="dataStatus" class="status-bar">⏳ 正在下載學生名單...</div>

        <div class="monitor-frame">
            <div class="monitor-placeholder" id="monitorPlaceholder">
                <p>🎥 監控畫面訊號區</p>
                <p style="font-size:0.8em">(若無影像，請確認監視器連結)</p>
            </div>
            <iframe id="monitorIframe" src="" style="width:100%; height:100%; border:none; position:absolute; top:0; left:0; display:none;" allowfullscreen></iframe>
        </div>

        <div style="color: #666; font-size: 0.9em;">
            點擊畫面任意處即可開始掃描 | 支援中文修正
        </div>
    </div>

    <div id="resultOverlay" class="overlay-card">
        <span class="overlay-icon"></span>
        <div class="overlay-main"></div>
        <div class="overlay-sub"></div>
    </div>

    <audio id="scanSound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>
    <audio id="errorSound" src="https://www.soundjay.com/buttons/beep-05.mp3"></audio>

    <script>
        // --- 設定區 ---
        const firebaseConfig = {
            apiKey: "AIzaSyB_-fHCMhi-URwyBqzAIipmffWwvNgzJJc",
            authDomain: "qr-scanner-app-2c73d.firebaseapp.com",
            databaseURL: "https://qr-scanner-app-2c73d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "qr-scanner-app-2c73d",
            storageBucket: "qr-scanner-app-2c73d.firebasestorage.app",
            messagingSenderId: "385628927398",
            appId: "1:385628927398:web:00239f1b2acebd6e790b67"
        };
        
        // GAS 網址 (維持不變)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";

        // 監視器網址 (選填)
        const CAMERA_URL = ""; 

        // 初始化
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allStudents = [];
        let isDataReady = false;
        let overlayTimer = null;

        // 1. 下載名單
        window.onload = function() {
            keepFocus();
            fetchStudentList();
            if(CAMERA_URL) {
                const iframe = document.getElementById('monitorIframe');
                iframe.src = CAMERA_URL;
                iframe.style.display = "block";
            }
        };

        function fetchStudentList() {
            const statusEl = document.getElementById('dataStatus');
            fetch(`${GOOGLE_SCRIPT_URL}?op=students`)
                .then(res => res.json())
                .then(data => {
                    allStudents = data;
                    isDataReady = true;
                    statusEl.innerText = `✅ 系統連線正常 (學生數: ${data.length})`;
                    statusEl.style.color = "#27ae60";
                    statusEl.style.background = "#e8f5e9";
                })
                .catch(err => {
                    statusEl.innerText = "❌ 無法下載名單，請檢查網路";
                    statusEl.style.color = "#c0392b";
                    statusEl.style.background = "#fadbd8";
                });
        }

        // 2. 聚焦與掃描監聽
        const input = document.getElementById('scannerInput');
        function keepFocus() { input.focus(); }
        document.addEventListener('click', keepFocus);
        input.addEventListener('blur', () => setTimeout(keepFocus, 100));

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                let content = this.value.trim();
                this.value = ''; 
                if (content.length > 0) {
                    content = fixGarbledInput(content); // 修復中文
                    processScan(content);
                }
            }
        });

        // 3. 處理掃描邏輯
        function processScan(rawInput) {
            if (!isDataReady) {
                showOverlay("error", "載入中", "請稍候...");
                return;
            }

            // 解析 ID
            const searchId = rawInput.split('-')[0].trim();
            console.log("查詢 ID:", searchId);

            // 本機查表
            const student = allStudents.find(s => String(s.id) === searchId);

            if (student) {
                // A. 成功 UI
                playAudio('scanSound');
                showOverlay("success", student.name, student.className);
                
                // B. 寫入 Firebase (超強保險版)
                pushToFirebaseQueue(student.name, student.className, searchId);
                
                // C. 寫入 GAS (針對 code.gs 格式優化)
                const fakeRawData = `${searchId}-${student.name}`;
                logToGAS(fakeRawData);

            } else {
                playAudio('errorSound');
                showOverlay("error", "查無此人", `ID: ${searchId}`);
            }
        }

        // ★★★ 4. 寫入 Firebase (修復欄位問題) ★★★
        function pushToFirebaseQueue(name, className, id) {
            // 防呆
            const safeClass = (className && className !== "(未分班)") ? className : "unknown";
            const targetPath = `queues/${safeClass}`;
            
            // 這裡同時寫入多種欄位名稱，不管看板程式在等哪個欄位，一定都收得到！
            database.ref(targetPath).push().set({
                id: id,
                
                // 學生姓名 (多給幾種常見命名，確保相容)
                name: name,         
                studentName: name,
                
                // 班級 (多給幾種常見命名)
                class: className,
                className: className,
                
                timestamp: new Date().toISOString(),
                status: 'waiting'
            }).catch(e => {
                console.error("Firebase 寫入錯誤", e);
            });
        }

        // ★★★ 5. 寫入 GAS (修復日誌報錯問題) ★★★
        function logToGAS(formattedContent) {
            // 送出 "1-蔡梵特" 這種 ID-Name 格式
            // code.gs 看到這個就會把 "1" 拿去查，這樣就查得到人了！
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({
                    type: 'scan',
                    content: formattedContent 
                }),
                headers: { "Content-Type": "text/plain" }
            }).catch(e => console.error("日誌紀錄失敗", e));
        }

        // 6. 工具函式
        function fixGarbledInput(str) {
            const map = { 'ㄅ':'1', 'ㄉ':'2', 'ˇ':'3', 'ˋ':'4', 'ㄓ':'5', 'ˊ':'6', '˙':'7', 'ㄚ':'8', 'ㄞ':'9', 'ㄢ':'0', 'ㄦ':'-' };
            let fixedStr = '';
            for (let char of str) fixedStr += map[char] || char;
            return fixedStr;
        }

        function showOverlay(type, mainText, subText) {
            const overlay = document.getElementById('resultOverlay');
            const icon = overlay.querySelector('.overlay-icon');
            const main = overlay.querySelector('.overlay-main');
            const sub = overlay.querySelector('.overlay-sub');
            overlay.className = `overlay-card ${type} show`;
            if (type === 'success') {
                icon.innerText = "✅"; main.innerText = mainText; sub.innerHTML = `<span class="class-badge">${subText}</span>`;
            } else {
                icon.innerText = "❌"; main.innerText = mainText; sub.innerText = subText;
            }
            if (overlayTimer) clearTimeout(overlayTimer);
            overlayTimer = setTimeout(() => { overlay.classList.remove('show'); }, 3000);
        }

        function playAudio(id) { document.getElementById(id).play().catch(()=>{}); }
    </script>
</body>
</html>
