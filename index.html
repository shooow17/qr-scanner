<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家長接送掃描站</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f2f5;
            height: 100vh;
            overflow: hidden; /* 防止出現捲軸 */
            display: flex;
        }

        /* --- 左側資訊區 (40%) --- */
        .info-panel {
            flex: 4;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* --- 右側鏡頭區 (60%) --- */
        .camera-panel {
            flex: 6;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 標題樣式 */
        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .sub-title {
            color: #7f8c8d;
            font-size: 1.2rem;
            margin-bottom: 50px;
        }

        /* 狀態顯示卡片 */
        .status-card {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            background: #f8f9fa;
            border: 2px dashed #bdc3c7;
            transition: all 0.3s ease;
        }

        /* 狀態：成功 */
        .status-card.success {
            background-color: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            transform: scale(1.05);
        }

        /* 狀態：處理中 */
        .status-card.processing {
            background-color: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }

        .icon { font-size: 5rem; margin-bottom: 20px; display: block; }
        .message { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
        .student-name { font-size: 2.2rem; font-weight: 900; color: #2c3e50; margin-top: 10px; }
        .time-stamp { font-size: 1rem; color: #666; margin-top: 10px; }

        /* 掃描器外框 */
        #reader {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* 隱藏套件多餘的文字 */
        #reader__dashboard_section_csr span { display: none; }
        /* 讓鏡頭畫面填滿 */
        #reader video { 
            object-fit: cover; 
            width: 100% !important; 
            height: 100% !important;
            border-radius: 0;
        }

        /* 返回按鈕 */
        .back-btn {
            margin-top: auto; /* 推到底部 */
            text-decoration: none;
            color: #95a5a6;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 50px;
            transition: 0.2s;
        }
        .back-btn:hover { background: #2c3e50; color: white; }

        /* 手機版適配 (直向時上下排列) */
        @media (max-width: 768px) {
            body { flex-direction: column-reverse; }
            .info-panel { flex: 1; padding: 20px; }
            .camera-panel { flex: 1; }
            h1 { font-size: 1.8rem; }
            .icon { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="info-panel">
        <div>
            <h1>家長接送掃描站</h1>
            <div class="sub-title">請將 QR Code 對準右側鏡頭</div>
        </div>

        <div id="statusCard" class="status-card">
            <span class="icon">📷</span>
            <div class="message">等待掃描...</div>
            <div class="student-name" id="studentNameDisplay"></div>
        </div>

        <a href="dashboard.html" class="back-btn">回主控台</a>
    </div>

    <div class="camera-panel">
        <div id="reader"></div>
    </div>

    <audio id="scanSound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>

    <script>
        // ★★★ GAS 網址 ★★★
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";
        
        let isLocked = false; // 鎖定狀態
        const LOCK_DURATION = 3000; // 鎖定 3 秒

        function onScanSuccess(decodedText, decodedResult) {
            // 如果正在鎖定中，直接忽略所有訊號
            if (isLocked) return;

            // 1. 立即鎖定並播放音效
            isLocked = true;
            document.getElementById('scanSound').play().catch(e => {});

            // 2. 介面顯示「處理中」(樂觀更新)
            updateUI("processing", "資料傳送中...", decodedText);

            // 3. 傳送至雲端 (非同步)
            sendToSheet(decodedText);

            // 4. 設定定時器，3秒後解鎖 (不管傳送成功與否，3秒後都準備掃下一個)
            setTimeout(() => {
                resetUI();
                isLocked = false;
            }, LOCK_DURATION);
        }

        function onScanFailure(error) {
            // 忽略雜訊
        }

        function sendToSheet(content) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({
                    type: 'scan',
                    content: content
                }),
                headers: { "Content-Type": "text/plain" }
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    // 如果傳送比 3 秒快，這裡會更新成成功狀態，直到 3 秒倒數結束才重置
                    updateUI("success", "✅ 掃描成功", data.name);
                } else {
                    updateUI("processing", "⚠️ 紀錄異常", "請重試");
                }
            })
            .catch(err => {
                console.error(err);
                // 即使網路錯誤，也會在 3 秒後重置，不卡死畫面
            });
        }

        function updateUI(state, msg, detail) {
            const card = document.getElementById('statusCard');
            const iconEl = card.querySelector('.icon');
            const msgEl = card.querySelector('.message');
            const nameEl = document.getElementById('studentNameDisplay');

            // 清除舊樣式
            card.classList.remove('success', 'processing');

            if (state === "processing") {
                card.classList.add('processing');
                iconEl.textContent = "⏳";
                msgEl.textContent = msg;
                nameEl.textContent = detail; // 先顯示掃到的原始碼
            } 
            else if (state === "success") {
                card.classList.add('success');
                iconEl.textContent = "✅";
                msgEl.textContent = msg;
                nameEl.textContent = detail; // 顯示後端回傳的正確姓名
            }
        }

        function resetUI() {
            const card = document.getElementById('statusCard');
            const iconEl = card.querySelector('.icon');
            const msgEl = card.querySelector('.message');
            const nameEl = document.getElementById('studentNameDisplay');

            card.classList.remove('success', 'processing');
            iconEl.textContent = "📷";
            msgEl.textContent = "等待掃描...";
            nameEl.textContent = "";
        }

        // 初始化掃描器 (全版面模式)
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10, 
                qrbox: {width: 400, height: 400}, // 加大掃描框
                aspectRatio: 1.0 
            },
            false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);

    </script>
</body>
</html>
