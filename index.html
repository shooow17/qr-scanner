<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家長接送掃描站</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --mc-green: #70B237;
            --mc-brown: #593D29;
            --mc-bg: #DCCFA3;
            --mc-border: #1D1D1D;
            --inset-light: inset 4px 4px 0 rgba(255,255,255,0.25);
            --inset-dark: inset -4px -4px 0 rgba(0,0,0,0.25);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            
            /* 沙灘背景 */
            background-color: var(--mc-bg);
            background-image: 
                radial-gradient(#C6B68D 15%, transparent 16%),
                radial-gradient(#C6B68D 15%, transparent 16%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
        }

        /* 主容器：左右分割 */
        .main-container {
            display: flex;
            flex-direction: row; /* 預設左右排列 */
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            gap: 30px;
            align-items: center;
        }

        /* --- 左側面板 (資訊區) --- */
        .info-panel {
            flex: 1; /* 佔比 1 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            padding: 10px;
        }

        h1 {
            font-family: 'Press Start 2P', 'Noto Sans TC', sans-serif;
            color: #333;
            text-shadow: 2px 2px 0 #fff;
            line-height: 1.5;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        /* 狀態結果框 (告示牌風格) */
        .result-box {
            background-color: var(--mc-brown);
            border: 4px solid var(--mc-border);
            padding: 25px;
            text-align: center;
            color: #fff;
            box-shadow: var(--inset-light), var(--inset-dark);
            border-radius: 4px;
            margin-bottom: 20px;
            min-height: 150px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .status-text { font-size: 1.2em; margin-bottom: 15px; opacity: 0.9; }
        .student-name { font-size: 2em; font-weight: bold; color: #FFD700; text-shadow: 3px 3px 0 #000; }

        /* 歷史紀錄 */
        .history-container {
            background: rgba(255,255,255,0.6);
            border: 4px solid var(--mc-border);
            padding: 15px;
            flex-grow: 1; /* 填滿剩餘空間 */
            overflow-y: auto; /* 內容多時可捲動 */
            max-height: 300px;
        }
        .history-title { font-weight: bold; border-bottom: 2px dashed #555; padding-bottom: 8px; margin-bottom: 8px; }
        .history-list { list-style: none; padding: 0; margin: 0; font-size: 0.9em; }
        .history-list li { padding: 8px 0; border-bottom: 1px dotted #888; display: flex; justify-content: space-between; }

        .back-btn {
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            background-color: var(--mc-green);
            color: white;
            padding: 15px;
            border: 4px solid var(--mc-border);
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.9em;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.3);
            display: block;
        }
        .back-btn:active { transform: translate(4px, 4px); box-shadow: none; }


        /* --- 右側面板 (鏡頭區) --- */
        .camera-panel {
            flex: 1.2; /* 佔比 1.2 (稍微大一點) */
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanner-frame {
            width: 100%;
            background: #000;
            padding: 15px;
            border: 8px solid var(--mc-border);
            border-radius: 8px;
            box-shadow: 12px 12px 0 rgba(0,0,0,0.3);
        }

        #reader { 
            width: 100%; 
            background: #000;
            border: 2px solid #555;
            min-height: 300px; /* 避免還沒載入時高度塌陷 */
        }

        /* 隱藏套件內建的醜醜文字 */
        #reader__dashboard_section_csr span { display: none; }

        /* --- RWD 手機版調整 --- */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column-reverse; /* 手機上：鏡頭在上，資訊在下 */
                height: auto;
                padding-bottom: 40px;
            }
            .info-panel { width: 100%; padding: 0; }
            .camera-panel { width: 100%; }
            .result-box { min-height: 100px; }
        }

    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="info-panel">
            <h1>📱 家長接送<br>掃描站</h1>
            
            <div class="result-box" id="resultBox">
                <div class="status-text">請查看右側鏡頭</div>
                <div class="student-name">等待掃描...</div>
            </div>

            <div class="history-container">
                <div class="history-title">🕒 最近 5 筆紀錄</div>
                <ul id="scanHistory" class="history-list">
                    <li style="color:#666; justify-content:center;">尚無紀錄</li>
                </ul>
            </div>

            <a href="dashboard.html" class="back-btn">⬅ 回主控台</a>
        </div>

        <div class="camera-panel">
            <div class="scanner-frame">
                <div id="reader"></div>
            </div>
        </div>

    </div>

    <audio id="scanSound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>

    <script>
        // ★★★ 請確認這是您最新的 GAS 網址 ★★★
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";
        
        let lastScanTime = 0;
        const scanCooldown = 3000; // 3秒冷卻

        function onScanSuccess(decodedText, decodedResult) {
            const now = Date.now();
            if (now - lastScanTime < scanCooldown) return;
            lastScanTime = now;

            // 播放音效
            document.getElementById('scanSound').play().catch(e => {});

            // 介面回饋
            updateUI("loading", "資料傳送中...", decodedText);

            // 傳送給 GAS
            sendToSheet(decodedText);
        }

        function onScanFailure(error) {
            // 忽略掃描失敗的雜訊
        }

        function sendToSheet(content) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({
                    type: 'scan',
                    content: content
                }),
                headers: { "Content-Type": "text/plain" }
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    updateUI("success", "✅ 掃描成功！", data.name);
                    addToHistory(data.name, data.time);
                } else {
                    updateUI("error", "❌ 錯誤", data.message);
                }
            })
            .catch(err => {
                updateUI("error", "連線失敗", "請檢查網路");
                console.error(err);
            });
        }

        function updateUI(status, msg, detail) {
            const resultBox = document.getElementById('resultBox');
            let color = "#fff"; // 預設白字

            if (status === "loading") color = "#f1c40f"; // 黃色
            if (status === "success") color = "#2ecc71"; // 綠色
            if (status === "error") color = "#e74c3c";   // 紅色

            resultBox.innerHTML = `
                <div class="status-text" style="color:${color}">${msg}</div>
                <div class="student-name">${detail}</div>
            `;

            // 如果是成功，3秒後復原
            if (status === "success") {
                setTimeout(() => {
                    resultBox.innerHTML = `
                        <div class="status-text">請查看右側鏡頭</div>
                        <div class="student-name">等待掃描...</div>
                    `;
                }, 3000);
            }
        }

        function addToHistory(name, time) {
            const list = document.getElementById('scanHistory');
            // 如果是第一筆，清空"尚無紀錄"
            if (list.children.length === 1 && list.children[0].textContent === "尚無紀錄") {
                list.innerHTML = "";
            }

            const li = document.createElement('li');
            li.innerHTML = `<span>${name}</span> <span style="color:#666">${time}</span>`;
            li.style.animation = "flash 1s"; // 簡單的閃爍效果
            
            list.insertBefore(li, list.firstChild);
            
            // 只保留 5 筆
            if (list.children.length > 5) {
                list.removeChild(list.lastChild);
            }
        }

        // 初始化掃描器
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: {width: 250, height: 250} },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);

        // 簡單的閃爍動畫
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes flash {
                0% { background-color: rgba(255, 215, 0, 0.5); }
                100% { background-color: transparent; }
            }
        `;
        document.head.appendChild(style);

    </script>
</body>
</html>
