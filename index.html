<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家長接送掃描系統</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --mc-green: #70B237;
            --mc-brown: #593D29;
            --mc-bg: #DCCFA3;
            --mc-border: #1D1D1D;
            --inset-light: inset 4px 4px 0 rgba(255,255,255,0.25);
            --inset-dark: inset -4px -4px 0 rgba(0,0,0,0.25);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh;
            
            /* 背景風格 */
            background-color: var(--mc-bg);
            background-image: 
                radial-gradient(#C6B68D 15%, transparent 16%),
                radial-gradient(#C6B68D 15%, transparent 16%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
        }

        h1 {
            font-family: 'Press Start 2P', 'Noto Sans TC', sans-serif;
            color: #333;
            text-shadow: 2px 2px 0 #fff;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* 掃描器外框 (模擬螢幕) */
        .scanner-frame {
            width: 100%; max-width: 500px;
            background: #000;
            padding: 15px;
            border: 6px solid var(--mc-border);
            border-radius: 4px;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
        }

        #reader { 
            width: 100%; 
            background: #000;
            border: 2px solid #555;
        }

        /* 結果顯示區 (告示牌風格) */
        .result-box {
            margin-top: 30px;
            width: 100%; max-width: 500px;
            background-color: var(--mc-brown);
            border: 4px solid var(--mc-border);
            padding: 20px;
            text-align: center;
            color: #fff;
            box-shadow: var(--inset-light), var(--inset-dark);
            min-height: 120px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .status-text {
            font-size: 1.1em; margin-bottom: 10px;
        }

        .student-name {
            font-size: 1.8em; font-weight: bold; color: #FFD700;
            text-shadow: 2px 2px 0 #000;
        }

        /* 歷史紀錄區 */
        .history-container {
            margin-top: 20px;
            width: 100%; max-width: 500px;
            background: rgba(255,255,255,0.5);
            border: 4px solid var(--mc-border);
            padding: 15px;
        }
        
        .history-title {
            font-weight: bold; margin-bottom: 10px; border-bottom: 2px dashed #666; padding-bottom: 5px;
        }

        .history-list {
            list-style: none; padding: 0; margin: 0; font-size: 0.9em;
        }
        .history-list li {
            padding: 5px 0; border-bottom: 1px dotted #999;
        }

        /* 按鈕風格 */
        .back-btn {
            margin-top: 40px;
            display: inline-block;
            text-decoration: none;
            background-color: var(--mc-green);
            color: white;
            padding: 15px 30px;
            border: 4px solid var(--mc-border);
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.9em;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .back-btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 rgba(0,0,0,0.3); }

        /* 隱藏 html5-qrcode 預設的一些醜醜的按鈕或文字 */
        #reader__dashboard_section_csr span { display: none; }
    </style>
</head>
<body>

    <h1>📱 家長接送<br>掃描站</h1>
    
    <div class="scanner-frame">
        <div id="reader"></div>
    </div>

    <div class="result-box" id="resultBox">
        <div class="status-text">請將 QR Code 對準鏡頭</div>
        <div class="student-name">等待掃描...</div>
    </div>

    <div class="history-container">
        <div class="history-title">🕒 最近掃描紀錄</div>
        <ul id="scanHistory" class="history-list">
            <li style="color:#666;">尚無紀錄</li>
        </ul>
    </div>

    <a href="dashboard.html" class="back-btn">⬅ 回主控台</a>

    <audio id="scanSound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>

    <script>
        // ★★★ 請確認這是您最新的 GAS 網址 ★★★
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";
        
        let lastScanTime = 0;
        const scanCooldown = 3000; // 3秒冷卻

        function onScanSuccess(decodedText, decodedResult) {
            const now = Date.now();
            if (now - lastScanTime < scanCooldown) return;
            lastScanTime = now;

            // 播放音效
            document.getElementById('scanSound').play().catch(e => {});

            // 介面回饋
            updateUI("loading", "資料傳送中...", decodedText);

            // 傳送給 GAS
            sendToSheet(decodedText);
        }

        function onScanFailure(error) {
            // 忽略掃描失敗的雜訊
        }

        function sendToSheet(content) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({
                    type: 'scan',
                    content: content
                }),
                headers: { "Content-Type": "text/plain" }
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    updateUI("success", "✅ 掃描成功！", data.name);
                    addToHistory(data.name, data.time);
                } else {
                    updateUI("error", "❌ 錯誤", data.message);
                }
            })
            .catch(err => {
                updateUI("error", "連線失敗", "請檢查網路");
                console.error(err);
            });
        }

        function updateUI(status, msg, detail) {
            const resultBox = document.getElementById('resultBox');
            let color = "#fff"; // 預設白字

            if (status === "loading") color = "#f1c40f"; // 黃色
            if (status === "success") color = "#2ecc71"; // 綠色
            if (status === "error") color = "#e74c3c";   // 紅色

            resultBox.innerHTML = `
                <div class="status-text" style="color:${color}">${msg}</div>
                <div class="student-name">${detail}</div>
            `;

            // 如果是成功，3秒後復原
            if (status === "success") {
                setTimeout(() => {
                    resultBox.innerHTML = `
                        <div class="status-text">請將 QR Code 對準鏡頭</div>
                        <div class="student-name">等待掃描...</div>
                    `;
                }, 3000);
            }
        }

        function addToHistory(name, time) {
            const list = document.getElementById('scanHistory');
            // 如果是第一筆，清空"尚無紀錄"
            if (list.children.length === 1 && list.children[0].textContent === "尚無紀錄") {
                list.innerHTML = "";
            }

            const li = document.createElement('li');
            li.innerHTML = `<strong>${time}</strong> - ${name}`;
            li.style.animation = "flash 1s"; // 簡單的閃爍效果
            
            list.insertBefore(li, list.firstChild);
            
            // 只保留 5 筆
            if (list.children.length > 5) {
                list.removeChild(list.lastChild);
            }
        }

        // 初始化掃描器
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: {width: 250, height: 250} },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);

    </script>
</body>
</html>
