<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家長接送掃描站 - 永順國小</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }

        h1 { margin-bottom: 20px; text-align: center; color: #f1c40f; }

        .scanner-container {
            width: 100%; max-width: 500px;
            background: #fff; padding: 10px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #reader { width: 100%; }

        /* 結果顯示區 */
        .result-box {
            margin-top: 20px; padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px; text-align: center;
            width: 100%; max-width: 500px;
            min-height: 100px;
            border: 2px dashed #7f8c8d;
        }

        .success-msg {
            color: #2ecc71; font-size: 1.5em; font-weight: bold;
            animation: popIn 0.5s ease;
        }

        .error-msg { color: #e74c3c; font-weight: bold; }

        .loading { color: #f39c12; font-weight: bold; }

        .history-list {
            margin-top: 20px; width: 100%; max-width: 500px;
            text-align: left; font-size: 0.9em; color: #bdc3c7;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .back-link {
            margin-top: 30px; color: #95a5a6; text-decoration: none;
            border: 1px solid #95a5a6; padding: 8px 20px; border-radius: 50px;
        }
        .back-link:hover { background: #fff; color: #2c3e50; }

    </style>
</head>
<body>

    <h1>📱 家長接送掃描站</h1>
    
    <div class="scanner-container">
        <div id="reader"></div>
    </div>

    <div class="result-box" id="resultBox">
        請將 QR Code 對準鏡頭...
    </div>

    <div class="history-list">
        <div>最近掃描紀錄：</div>
        <ul id="scanHistory" style="padding-left: 20px;"></ul>
    </div>

    <a href="dashboard.html" class="back-link">回主控台</a>

    <audio id="scanSound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>

    <script>
        // ★★★ 請替換您的 GAS 網址 (與 student_admin.html 同一個) ★★★
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";
        
        let isScanning = true;
        let lastScanTime = 0;
        const scanCooldown = 3000; // 防止重複掃描冷卻時間 (毫秒)

        function onScanSuccess(decodedText, decodedResult) {
            // 防止短時間內重複掃描
            const now = Date.now();
            if (now - lastScanTime < scanCooldown) return;
            lastScanTime = now;

            // 播放音效
            document.getElementById('scanSound').play().catch(e => {});

            // 顯示處理中
            const resultBox = document.getElementById('resultBox');
            resultBox.innerHTML = `<div class="loading">🔄 資料傳送中...<br>${decodedText}</div>`;

            // 傳送給 GAS
            sendToSheet(decodedText);
        }

        function onScanFailure(error) {
            // 掃描失敗通常不用處理，避免一直報錯
        }

        function sendToSheet(content) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({
                    type: 'scan',
                    content: content
                }),
                headers: { "Content-Type": "text/plain" }
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    showSuccess(data.name, data.time);
                    addToHistory(data.name, data.time);
                } else {
                    showError("傳送失敗：" + data.message);
                }
            })
            .catch(err => {
                showError("連線錯誤，請檢查網路");
                console.error(err);
            });
        }

        function showSuccess(name, time) {
            const resultBox = document.getElementById('resultBox');
            resultBox.innerHTML = `
                <div class="success-msg">✅ 掃描成功！</div>
                <div style="margin-top:10px; font-size:1.2em; color: white;">${name}</div>
                <div style="font-size:0.8em; color:#bdc3c7;">${time}</div>
            `;
            
            // 3秒後恢復待機文字
            setTimeout(() => {
                resultBox.innerHTML = "請將 QR Code 對準鏡頭...";
            }, 3000);
        }

        function showError(msg) {
            document.getElementById('resultBox').innerHTML = `<div class="error-msg">❌ ${msg}</div>`;
        }

        function addToHistory(name, time) {
            const list = document.getElementById('scanHistory');
            const li = document.createElement('li');
            li.textContent = `[${time}] ${name}`;
            // 插入到最上方
            list.insertBefore(li, list.firstChild);
            
            // 只保留最近 5 筆
            if (list.children.length > 5) {
                list.removeChild(list.lastChild);
            }
        }

        // 初始化掃描器
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: {width: 250, height: 250} },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);

    </script>
</body>
</html>
