<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code 自動生成與下載</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --success-color: #4cc9f0;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2b2d42;
            --text-sub: #8d99ae;
        }

        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
        }

        /* --- 標題區 --- */
        .header-area {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5em;
            margin: 0;
            background: linear-gradient(45deg, var(--primary-color), var(--success-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-sub);
            margin-top: 10px;
            font-size: 1.1em;
        }

        /* --- 控制面板 (玻璃擬態風格) --- */
        .controls {
            background: var(--card-bg);
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
            transition: transform 0.3s;
            border: 1px solid rgba(255,255,255,0.8);
        }

        .controls:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        /* --- 按鈕群 --- */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 12px 30px;
            border-radius: 50px; /* 圓形按鈕 */
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #btn-load {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }
        #btn-load:hover {
            filter: brightness(1.1);
            transform: scale(1.05);
        }

        #btn-download {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            display: none;
        }
        #btn-download:hover {
            filter: brightness(1.1);
            transform: scale(1.05);
        }

        button:disabled {
            background: #e0e0e0;
            color: #999;
            box-shadow: none;
            cursor: not-allowed;
            transform: none !important;
        }

        /* --- 進度條 --- */
        #progress-container {
            width: 100%;
            background-color: #edf2f4;
            border-radius: 10px;
            margin-top: 25px;
            height: 12px;
            display: none;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--success-color), var(--primary-color));
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        #status-text {
            margin-top: 15px;
            color: var(--text-sub);
            font-size: 0.9em;
            font-weight: 500;
        }

        /* --- 預覽區域 --- */
        #preview-area {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        /* 班級標題 */
        .class-section {
            grid-column: 1 / -1;
            background: transparent;
            padding: 15px 0 5px 0;
            margin-top: 20px;
            border-bottom: 2px solid #e0e0e0;
            color: var(--text-main);
            font-size: 1.4em;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .class-icon {
            color: var(--primary-color);
        }

        /* QR Code 卡片 */
        .qr-card {
            background: white;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .qr-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            border-color: var(--success-color);
        }
        
        /* 裝飾線條 */
        .qr-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-color), var(--success-color));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .qr-card:hover::before { opacity: 1; }

        .qr-card img {
            width: 160px !important;
            height: auto !important;
            margin-bottom: 20px;
            padding: 5px;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        .student-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .student-id {
            font-size: 0.9em;
            color: #999;
            background: #f5f5f5;
            padding: 2px 8px;
            border-radius: 4px;
        }
        
        .back-link {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            color: var(--text-main);
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-weight: bold;
            transition: all 0.3s;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-link:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            color: var(--primary-color);
        }

    </style>
</head>
<body>

    <div class="header-area">
        <h1><i class="fas fa-qrcode"></i>QR Code 自動生成與下載</h1>
        <div class="subtitle">自動同步 Google 試算表 • 高解析度輸出 • 智慧分班打包</div>
    </div>
    
    <div class="controls">
        <p style="color: #666; margin-bottom: 20px;">
            系統將自動讀取名單，並排除表頭資料。<br>生成的 QR Code 為 <strong>800x800 高解析度</strong>，適合印刷。
        </p>
        
        <div class="btn-group">
            <button id="btn-load" onclick="loadData()">
                <i class="fas fa-cloud-download-alt"></i> 1. 讀取名單 & 產生預覽
            </button>
            <button id="btn-download" onclick="downloadZip()">
                <i class="fas fa-file-archive"></i> 2. 打包下載 ZIP
            </button>
        </div>
        
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="status-text"></div>
    </div>

    <div id="preview-area"></div>
    
    <a href="dashboard.html" class="back-link">
        <i class="fas fa-arrow-left"></i> 回主控台
    </a>

    <script>
        // --- 設定 ---
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";
        // -----------

        let allStudents = []; 
        
        async function loadData() {
            const btnLoad = document.getElementById('btn-load');
            const previewArea = document.getElementById('preview-area');
            const statusText = document.getElementById('status-text');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');

            btnLoad.disabled = true;
            statusText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在連線 Google 試算表...';
            previewArea.innerHTML = "";
            allStudents = [];

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                // --- [關鍵修正] 資料過濾與排序 ---
                const studentsArray = Object.entries(data)
                    .map(([id, info]) => ({
                        id: String(id).trim(),
                        name: String(info.name).trim(),
                        class: String(info.class).trim()
                    }))
                    .filter(student => {
                        // [過濾邏輯] 排除可能是標題的資料
                        // 如果 ID 或 姓名 包含這些關鍵字，就跳過
                        const invalidKeywords = ["ID", "id", "學生", "姓名", "班級", "Student", "Name", "Class", "編號"];
                        const isHeader = invalidKeywords.includes(student.id) || invalidKeywords.includes(student.name);
                        return !isHeader && student.id !== ""; // 確保不是標題且 ID 不為空
                    })
                    .sort((a, b) => {
                        // 先排班級，再排 ID
                        if (a.class === b.class) return a.id.localeCompare(b.id, undefined, {numeric: true});
                        return a.class.localeCompare(b.class, undefined, {numeric: true});
                    });
                // ---------------------------------

                if (studentsArray.length === 0) throw new Error("沒有有效的學生資料 (或格式錯誤)");

                statusText.textContent = `成功取得 ${studentsArray.length} 筆有效資料，開始繪製...`;
                progressContainer.style.display = 'block';
                
                let currentClass = "";
                
                for (let i = 0; i < studentsArray.length; i++) {
                    const student = studentsArray[i];
                    allStudents.push(student);

                    // 班級標題
                    if (student.class !== currentClass) {
                        currentClass = student.class;
                        const classHeader = document.createElement('div');
                        classHeader.className = 'class-section';
                        classHeader.innerHTML = `<i class="fas fa-folder-open class-icon"></i> 班級：${currentClass}`;
                        previewArea.appendChild(classHeader);
                    }

                    // 卡片
                    const card = document.createElement('div');
                    card.className = 'qr-card';
                    
                    const qrDiv = document.createElement('div');
                    // 內容：ID-姓名
                    const qrContent = `${student.id}-${student.name}`;
                    
                    // 產生 800x800 高解析度圖片
                    new QRCode(qrDiv, {
                        text: qrContent,
                        width: 800,  
                        height: 800, 
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        typeNumber: 10,
                        correctLevel : QRCode.CorrectLevel.L
                    });

                    // 等待渲染
                    await new Promise(r => setTimeout(r, 10)); 

                    // 學生資訊
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'student-name';
                    nameDiv.textContent = student.name;
                    
                    const idDiv = document.createElement('div');
                    idDiv.className = 'student-id';
                    idDiv.textContent = student.id;

                    card.appendChild(qrDiv);
                    card.appendChild(nameDiv);
                    card.appendChild(idDiv);
                    previewArea.appendChild(card);

                    // 進度條
                    const progress = Math.round(((i + 1) / studentsArray.length) * 100);
                    progressBar.style.width = `${progress}%`;
                    
                    if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
                }

                statusText.innerHTML = '<i class="fas fa-check-circle"></i> 產生完成！請檢查後按下「打包下載」。';
                document.getElementById('btn-download').style.display = 'inline-block';
                btnLoad.innerHTML = '<i class="fas fa-sync-alt"></i> 重新讀取';
                btnLoad.disabled = false;

            } catch (err) {
                console.error(err);
                statusText.innerHTML = `<span style="color: #e63946;"><i class="fas fa-exclamation-triangle"></i> 錯誤：${err.message}</span>`;
                alert("讀取失敗，請檢查 GAS 權限或網路狀態。");
                btnLoad.disabled = false;
            }
        }

        async function downloadZip() {
            if (allStudents.length === 0) return;

            const zip = new JSZip();
            const statusText = document.getElementById('status-text');
            const btnDownload = document.getElementById('btn-download');
            
            btnDownload.disabled = true;
            statusText.innerHTML = '<i class="fas fa-cog fa-spin"></i> 正在打包 ZIP 檔案，檔案較大請稍候...';

            const cards = document.querySelectorAll('.qr-card');
            
            for (let i = 0; i < cards.length; i++) {
                const student = allStudents[i];
                const img = cards[i].querySelector('img');
                
                if (img) {
                    const imgData = img.src.split(',')[1];
                    const folder = zip.folder(student.class);
                    // 檔名：ID姓名.png
                    folder.file(`${student.id}${student.name}.png`, imgData, {base64: true});
                }
            }

            statusText.textContent = "正在壓縮...";
            
            zip.generateAsync({type:"blob"}).then(function(content) {
                const today = new Date().toISOString().split('T')[0];
                saveAs(content, `學生QR_Codes_HighRes_${today}.zip`);
                
                statusText.innerHTML = '<i class="fas fa-check-double"></i> 下載已開始！請查看瀏覽器下載區。';
                btnDownload.disabled = false;
            });
        }
    </script>
</body>
</html>
