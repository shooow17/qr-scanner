<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code 智慧產生器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --success-color: #4cc9f0;
            --pdf-color: #e63946; /* PDF 按鈕專用紅 */
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2b2d42;
            --text-sub: #8d99ae;
        }

        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
        }

        /* --- 標題區 --- */
        .header-area {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5em;
            margin: 0;
            background: linear-gradient(45deg, var(--primary-color), var(--success-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-sub);
            margin-top: 10px;
            font-size: 1.1em;
        }

        /* --- 控制面板 --- */
        .controls {
            background: var(--card-bg);
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 900px;
            margin-bottom: 40px;
            border: 1px solid rgba(255,255,255,0.8);
        }

        /* --- 按鈕群 --- */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #btn-load {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }
        
        /* 下載 ZIP (綠色) */
        #btn-download {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            display: none;
        }

        /* [新增] 下載 PDF (紅色) */
        #btn-pdf {
            background: linear-gradient(135deg, #FF512F, #DD2476);
            color: white;
            display: none;
        }

        button:hover {
            filter: brightness(1.1);
            transform: scale(1.05);
        }

        button:disabled {
            background: #e0e0e0;
            color: #999;
            box-shadow: none;
            cursor: not-allowed;
            transform: none !important;
        }

        /* --- 進度條 --- */
        #progress-container {
            width: 100%;
            background-color: #edf2f4;
            border-radius: 10px;
            margin-top: 25px;
            height: 12px;
            display: none;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--success-color), var(--primary-color));
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        #status-text {
            margin-top: 15px;
            color: var(--text-sub);
            font-size: 0.9em;
            font-weight: 500;
        }

        /* --- 預覽區域 --- */
        #preview-area {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        /* 隱藏的 Canvas 容器 (給 PDF 生成用) */
        #canvas-container {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }

        /* 班級標題 */
        .class-section {
            grid-column: 1 / -1;
            background: transparent;
            padding: 15px 0 5px 0;
            margin-top: 20px;
            border-bottom: 2px solid #e0e0e0;
            color: var(--text-main);
            font-size: 1.4em;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .class-icon { color: var(--primary-color); }

        /* QR Code 卡片 */
        .qr-card {
            background: white;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.3s;
            border: 1px solid #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .qr-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            border-color: var(--success-color);
        }
        
        .qr-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, var(--primary-color), var(--success-color));
            opacity: 0; transition: opacity 0.3s;
        }
        .qr-card:hover::before { opacity: 1; }

        /* 預覽圖強制縮小 */
        .qr-card img {
            width: 160px !important;
            height: auto !important;
            margin-bottom: 20px;
            padding: 5px;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        .student-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .student-id {
            font-size: 0.9em;
            color: #999;
            background: #f5f5f5;
            padding: 2px 8px;
            border-radius: 4px;
        }
        
        .back-link {
            position: fixed; bottom: 30px; right: 30px;
            background: white; color: var(--text-main);
            text-decoration: none; padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-weight: bold; transition: all 0.3s; z-index: 100;
            display: flex; align-items: center; gap: 8px;
        }
        .back-link:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            color: var(--primary-color);
        }

    </style>
</head>
<body>

    <div class="header-area">
        <h1><i class="fas fa-qrcode"></i> QR Code 智慧產生器</h1>
        <div class="subtitle">自動同步 Google 試算表 • 高解析度輸出 • 智慧分班排版</div>
    </div>
    
    <div class="controls">
        <p style="color: #666; margin-bottom: 20px;">
            系統將自動讀取名單，產生 800x800 高解析度 QR Code。<br>
            可選擇下載 ZIP 原始檔，或直接輸出 A4 列印版 PDF。
        </p>
        
        <div class="btn-group">
            <button id="btn-load" onclick="loadData()">
                <i class="fas fa-cloud-download-alt"></i> 1. 讀取名單 & 產生預覽
            </button>
            <button id="btn-download" onclick="downloadZip()">
                <i class="fas fa-file-archive"></i> 2. 下載原始圖 (ZIP)
            </button>
            <button id="btn-pdf" onclick="generatePDF()">
                <i class="fas fa-file-pdf"></i> 3. 輸出列印檔 (PDF)
            </button>
        </div>
        
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="status-text"></div>
    </div>

    <div id="preview-area"></div>
    
    <div id="canvas-container"></div>
    
    <a href="dashboard.html" class="back-link">
        <i class="fas fa-arrow-left"></i> 回主控台
    </a>

    <script>
        // --- 設定 ---
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";
        // -----------

        let allStudents = []; 
        
        async function loadData() {
            const btnLoad = document.getElementById('btn-load');
            const previewArea = document.getElementById('preview-area');
            const statusText = document.getElementById('status-text');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');

            btnLoad.disabled = true;
            statusText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在連線 Google 試算表...';
            previewArea.innerHTML = "";
            allStudents = [];

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                // --- ★ 關鍵修正：前端對接 code.gs 的 JSON 格式 ---
                const studentsArray = data
                    .map(info => ({
                        id: String(info.id || "").trim(),
                        name: String(info.name || "").trim(),
                        class: String(info.className || "未分班").trim() // 對應 code.gs 傳來的 className
                    }))
                    .filter(student => {
                        const invalidKeywords = ["ID", "id", "學生", "姓名", "班級", "Student", "Name", "Class", "編號"];
                        const isHeader = invalidKeywords.includes(student.id) || invalidKeywords.includes(student.name);
                        // 過濾掉標題列、空 ID 以及不完整的資料
                        return !isHeader && student.id !== "" && student.class !== "undefined" && student.name !== "undefined"; 
                    })
                    .sort((a, b) => {
                        // 1. 先照班級排序
                        if (a.class === b.class) {
                            // 2. 如果同班，照學號排序
                            return a.id.localeCompare(b.id, undefined, {numeric: true});
                        }
                        return a.class.localeCompare(b.class, undefined, {numeric: true});
                    });
                // --------------------------------------------------

                if (studentsArray.length === 0) throw new Error("沒有有效的學生資料，請檢查 Google Sheets 是否有填寫內容。");

                statusText.textContent = `成功取得 ${studentsArray.length} 筆有效資料，開始繪製...`;
                progressContainer.style.display = 'block';
                
                let currentClass = "";
                
                for (let i = 0; i < studentsArray.length; i++) {
                    const student = studentsArray[i];
                    allStudents.push(student);

                    if (student.class !== currentClass) {
                        currentClass = student.class;
                        const classHeader = document.createElement('div');
                        classHeader.className = 'class-section';
                        classHeader.innerHTML = `<i class="fas fa-folder-open class-icon"></i> 班級：${currentClass}`;
                        previewArea.appendChild(classHeader);
                    }

                    const card = document.createElement('div');
                    card.className = 'qr-card';
                    
                    const qrDiv = document.createElement('div');
                    // ID-姓名 (掃描用)
                    const qrContent = `${student.id}-${student.name}`;
                    
                    // 產生 800x800 高解析度圖片
                    new QRCode(qrDiv, {
                        text: qrContent,
                        width: 800,  
                        height: 800, 
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        typeNumber: 10,
                        correctLevel : QRCode.CorrectLevel.L
                    });

                    await new Promise(r => setTimeout(r, 10)); 

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'student-name';
                    nameDiv.textContent = student.name;
                    
                    const idDiv = document.createElement('div');
                    idDiv.className = 'student-id';
                    idDiv.textContent = student.id;

                    card.appendChild(qrDiv);
                    card.appendChild(nameDiv);
                    card.appendChild(idDiv);
                    previewArea.appendChild(card);

                    const progress = Math.round(((i + 1) / studentsArray.length) * 100);
                    progressBar.style.width = `${progress}%`;
                    
                    if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
                }

                statusText.innerHTML = '<i class="fas fa-check-circle"></i> 產生完成！請選擇下載方式。';
                document.getElementById('btn-download').style.display = 'inline-block';
                document.getElementById('btn-pdf').style.display = 'inline-block'; // 顯示 PDF 按鈕
                btnLoad.innerHTML = '<i class="fas fa-sync-alt"></i> 重新讀取';
                btnLoad.disabled = false;

            } catch (err) {
                console.error(err);
                statusText.innerHTML = `<span style="color: #e63946;"><i class="fas fa-exclamation-triangle"></i> 錯誤：${err.message}</span>`;
                alert("讀取失敗，請檢查網路狀態或確認試算表內是否有資料。");
                btnLoad.disabled = false;
            }
        }

        async function downloadZip() {
            if (allStudents.length === 0) return;
            const zip = new JSZip();
            const statusText = document.getElementById('status-text');
            const btn = document.getElementById('btn-download');
            
            btn.disabled = true;
            statusText.innerHTML = '<i class="fas fa-cog fa-spin"></i> 正在打包 ZIP，檔案較大請稍候...';

            const cards = document.querySelectorAll('.qr-card');
            for (let i = 0; i < cards.length; i++) {
                const student = allStudents[i];
                const img = cards[i].querySelector('img');
                if (img) {
                    const imgData = img.src.split(',')[1];
                    const folder = zip.folder(student.class);
                    folder.file(`${student.id}_${student.name}.png`, imgData, {base64: true});
                }
            }

            zip.generateAsync({type:"blob"}).then(function(content) {
                const today = new Date().toISOString().split('T')[0];
                saveAs(content, `學生QR_Codes_HighRes_${today}.zip`);
                statusText.innerHTML = '<i class="fas fa-check-double"></i> ZIP 下載已開始！';
                btn.disabled = false;
            });
        }

        // --- 生成 2x4 PDF ---
        async function generatePDF() {
            if (allStudents.length === 0) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const statusText = document.getElementById('status-text');
            const btn = document.getElementById('btn-pdf');

            btn.disabled = true;
            statusText.innerHTML = '<i class="fas fa-print fa-spin"></i> 正在排版 PDF 文件 (A4 / 8格)...';

            // 版面設定 (單位 mm)
            const marginX = 10;
            const marginY = 10;
            const cardWidth = 90;
            const cardHeight = 65;
            const gapX = 10;
            const gapY = 5;
            const startX = 10;
            const startY = 15;

            // 抓取所有圖片
            const cards = document.querySelectorAll('.qr-card img');
            
            for (let i = 0; i < allStudents.length; i++) {
                const student = allStudents[i];
                const img = cards[i];
                
                // 計算位置 (0-7)
                const posIndex = i % 8;
                const col = posIndex % 2; // 0 或 1
                const row = Math.floor(posIndex / 2); // 0, 1, 2, 3

                // 換頁判斷
                if (i > 0 && posIndex === 0) {
                    doc.addPage();
                }

                // 計算座標
                const x = startX + col * (cardWidth + gapX);
                const y = startY + row * (cardHeight + gapY);

                // 1. 畫外框 (卡片邊界)
                doc.setDrawColor(200); // 淺灰框
                doc.rect(x, y, cardWidth, cardHeight);

                // 2. 畫 QR Code
                if (img) {
                    const imgData = img.src;
                    // QR Code 大小 45x45 mm，居中
                    doc.addImage(imgData, 'PNG', x + 22.5, y + 5, 45, 45);
                }

                // 3. 處理中文字型 (用 Canvas 畫成圖片貼上)
                const canvas = document.createElement('canvas');
                canvas.width = 300;
                canvas.height = 80;
                const ctx = canvas.getContext('2d');
                
                // 白底
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, 300, 80);
                
                // 文字設定
                ctx.fillStyle = "#000000";
                ctx.textAlign = "center";
                ctx.font = "bold 36px 'Microsoft JhengHei', sans-serif";
                ctx.fillText(`${student.class} ${student.name}`, 150, 40);
                
                ctx.fillStyle = "#555555";
                ctx.font = "24px Arial";
                ctx.fillText(`ID: ${student.id}`, 150, 70);

                const textImgData = canvas.toDataURL("image/png");
                
                // 貼上文字圖片 (在 QR Code 下方)
                doc.addImage(textImgData, 'PNG', x + 5, y + 50, 80, 15);

                // 4. 進度更新
                const progress = Math.round(((i + 1) / allStudents.length) * 100);
                // 稍微延遲讓介面更新
                if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
            }

            statusText.textContent = "正在生成 PDF 檔案...";
            const today = new Date().toISOString().split('T')[0];
            doc.save(`學生QR_Code_名牌_${today}.pdf`);
            
            statusText.innerHTML = '<i class="fas fa-check-double"></i> PDF 下載完成！';
            btn.disabled = false;
        }
    </script>
</body>
</html>
