<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警衛室學生狀態頁面</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #E8F5E9; display: flex; justify-content: center; align-items: center; flex-direction: column; min-height: 100vh; margin: 0; padding: 20px 0; color: #333; box-sizing: border-box; }
        .container { text-align: center; background-color: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1); width: 90%; max-width: 1200px; }
        h1 { font-size: 2.5em; margin: 0; color: #1B5E20; }
        #alert-grid { margin-top: 20px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; width: 100%; }
        .alert-item { padding: 15px; border: 1px solid #C8E6C9; border-radius: 8px; text-align: left; background-color: #fafafa; overflow: hidden; display: flex; flex-direction: column; justify-content: center; line-height: 1.4; height: 120px; position: relative; }
        .placeholder { background-color: #fdfdfd; border: 1px dashed #A5D6A7; display: flex; align-items: center; justify-content: center; font-size: 1.2em; color: #ccc; height: 120px; }
        .delete-btn { position: absolute; top: 5px; right: 5px; width: 28px; height: 28px; line-height: 28px; text-align: center; font-size: 22px; font-weight: bold; color: #aaa; background-color: #f0f0f0; border-radius: 50%; cursor: pointer; transition: all 0.2s; }
        .delete-btn:hover { background-color: #d84315; color: white; transform: scale(1.1); }
        .alert-message { font-size: 1.1em; color: #333; font-weight: bold; }
        .alert-message .student-name { color: #388E3C; display: block; font-size: 1.2em; margin-bottom: 5px; }
        .alert-message .status { color: #d84315; }
        .alert-time { font-size: 0.9em; color: #777; margin-top: 8px; display: block; }
        
        /* [修改] 控制按鈕區域 */
        .controls { margin-top: 20px; width: 100%; display: flex; justify-content: center; gap: 20px; }
        .controls button { color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-size: 1em; }
        #btn-clear-local { background-color: #FF9800; }
        #btn-export { background-color: #00796b; }
        /* (已移除 clear-db 按鈕樣式) */

        @media (max-width: 1024px) { .container { padding: 20px; } #alert-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { body { padding: 10px 0; } .container { width: 95%; padding: 15px; } h1 { font-size: 2em; } #alert-grid { grid-template-columns: 1fr; max-height: 60vh; overflow-y: auto; } .alert-item { height: auto; padding: 12px; padding-top: 35px; } .controls { flex-direction: column; gap: 10px; } .controls button { width: 100%; padding: 12px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>警衛室即時訊息</h1>
        <div id="alert-grid"></div>
        <div class="controls">
            <button id="btn-export" onclick="exportReport()">匯出報表 (CSV)</button>
            <button id="btn-clear-local" onclick="clearLocalScreen()">清除畫面上所有資料</button>
            </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyB_-fHCMhi-URwyBqzAIipmffWwvNgzJJc",
          authDomain: "qr-scanner-app-2c73d.firebaseapp.com",
          databaseURL: "https://qr-scanner-app-2c73d-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "qr-scanner-app-2c73d",
          storageBucket: "qr-scanner-app-2c73d.firebasestorage.app",
          messagingSenderId: "385628927398",
          appId: "1:385628927398:web:00239f1b2acebd6e790b67"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const alertsRef = database.ref("alerts");
        const MAX_ALERTS = 15; 
        let alertHistory = []; 

        function maskName(n) {
            if (!n) return "";
            if (n.length <= 1) return n;
            if (n.length === 2) return n.substring(0, 1) + "O";
            let masked = n.substring(0, 1);
            masked += "O".repeat(n.length - 2);
            masked += n.substring(n.length - 1);
            return masked;
        }
        
        function renderGrid() {
            const gridElement = document.getElementById('alert-grid');
            gridElement.innerHTML = ''; 
            const itemsToDisplay = alertHistory.slice(-MAX_ALERTS).reverse();
            for (let i = 0; i < MAX_ALERTS; i++) {
                const item = itemsToDisplay[i];
                const cell = document.createElement('div');
                if (item) {
                    cell.className = 'alert-item';
                    const maskedName = maskName(item.name);
                    const localTime = new Date(item.timestamp).toLocaleString('zh-TW');
                    cell.innerHTML = `
                        <div class="delete-btn" onclick="deleteAlert('${item.key}')">×</div>
                        <div class="alert-message">
                            <span class="student-name">${maskedName} (${item.class})</span>
                            <span class="status">${item.status}</span>
                        </div>
                        <span class="alert-time">(時間: ${localTime})</span>
                    `;
                } else {
                    cell.className = 'alert-item placeholder';
                    cell.textContent = '---'; 
                }
                gridElement.appendChild(cell);
            }
        }

        function clearLocalScreen() {
             if (!confirm("確定要清除「畫面上」的所有資料嗎？(資料庫不會被刪除)")) return;
            alertHistory = [];
            renderGrid();
        }
        
        function deleteAlert(key) {
             if (!confirm("確定要刪除這筆訊息嗎？(這只會刪除警衛室資料)")) return;
            if (key) alertsRef.child(key).remove().catch(err => alert(`刪除失敗: ${err.message}`));
        }
        
        function exportReport() {
            if (alertHistory.length === 0) return alert("目前沒有資料可匯出。");
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "時間,班級,學生姓名,狀態\r\n";
            [...alertHistory].reverse().forEach(item => {
                const time = new Date(item.timestamp).toLocaleString('zh-TW');
                const row = `"${time}","${item.class}","${item.name}","${item.status}"`;
                csvContent += row + "\r\n";
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `警衛室報表_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        document.addEventListener('DOMContentLoaded', () => {
            alertsRef.limitToLast(MAX_ALERTS).on('child_added', (snapshot) => {
                const alertData = snapshot.val();
                alertData.key = snapshot.key; 
                alertHistory.push(alertData); 
                renderGrid(); 
            });
            alertsRef.on('value', (snapshot) => {
                if (!snapshot.exists()) { alertHistory = []; renderGrid(); }
            });
            alertsRef.on('child_removed', (snapshot) => {
                alertHistory = alertHistory.filter(item => item.key !== snapshot.key);
                renderGrid();
            });
            renderGrid();
        });
    </script>
</body>
</html>
