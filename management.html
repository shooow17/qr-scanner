<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統管理介面</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; background-color: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #d32f2f; margin-bottom: 30px; }
        button { background-color: #d32f2f; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.2em; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #b71c1c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ 危險區域：系統管理</h1>
        <p>此操作將會刪除所有班級的掃描佇列和警衛室的紀錄。</p>
        <br>
        <button onclick="clearDatabase()">🔥 清空所有資料庫 🔥</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyB_-fHCMhi-URwyBqzAIipmffWwvNgzJJc",
          authDomain: "qr-scanner-app-2c73d.firebaseapp.com",
          databaseURL: "https://qr-scanner-app-2c73d-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "qr-scanner-app-2c73d",
          storageBucket: "qr-scanner-app-2c73d.firebasestorage.app",
          messagingSenderId: "385628927398",
          appId: "1:385628927398:web:00239f1b2acebd6e790b67"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function clearDatabase() {
            if (!confirm("【嚴重警告】\n你確定要「永久刪除」所有資料嗎？\n\n這將會清空：\n1. 所有班級的等待學生\n2. 所有警衛室的訊息紀錄\n\n此動作無法復原！")) {
                return;
            }
            
            // 再次確認
            if (!confirm("請再次確認：真的要清空嗎？")) return;

            console.log("正在清空資料庫...");
            
            // 同時刪除 alerts 和 queues
            Promise.all([
                database.ref("alerts").remove(),
                database.ref("queues").remove()
            ]).then(() => {
                alert("✅ 資料庫已成功清空！");
            }).catch(err => {
                alert(`❌ 清空失敗: ${err.message}`);
            });
        }
    </script>
</body>
</html>
