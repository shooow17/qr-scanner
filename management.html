<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動清除介面</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { 
            font-family: "Microsoft JhengHei", Arial, sans-serif; 
            background-color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            text-align: center; 
            background-color: #fff; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            width: 90%;
            max-width: 500px;
        }
        h1 { color: #d32f2f; margin-bottom: 20px; }
        p { color: #555; font-size: 1.1em; line-height: 1.6; }
        
        button { 
            background-color: #d32f2f; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 8px; 
            font-size: 1.2em; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 20px;
        }
        button:hover { background-color: #b71c1c; }

        /* [新] 時間顯示區塊 */
        .status-box {
            margin-top: 30px;
            padding: 15px;
            background-color: #e3f2fd;
            border-radius: 8px;
            color: #0d47a1;
            font-size: 0.9em;
        }
        #clock {
            font-size: 1.5em;
            font-weight: bold;
            margin: 10px 0;
            font-family: monospace;
        }
        .auto-badge {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            vertical-align: middle;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ 請小心操作：系統管理</h1>
        <p>此操作將會刪除所有班級的掃描佇列和警衛室的紀錄。</p>
        <button onclick="manualClear()">🔥 手動清空所有資料庫 🔥</button>

        <div class="status-box">
            <div>目前系統時間</div>
            <div id="clock">--:--:--</div>
            <div style="margin-top: 5px;">
                自動排程已啟動 <span class="auto-badge">ON</span>
            </div>
            <div style="color: #666; font-size: 0.9em; margin-top: 5px;">
                將於每天 <strong>16:00</strong> 與 <strong>18:00</strong> 自動執行清空<br>
                (請保持此頁面開啟)
            </div>
        </div>
    </div>

    <script>
        // --- 2. 你的 Firebase 設定 (已填入) ---
        const firebaseConfig = {
          apiKey: "AIzaSyB_-fHCMhi-URwyBqzAIipmffWwvNgzJJc",
          authDomain: "qr-scanner-app-2c73d.firebaseapp.com",
          databaseURL: "https://qr-scanner-app-2c73d-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "qr-scanner-app-2c73d",
          storageBucket: "qr-scanner-app-2c73d.firebasestorage.app",
          messagingSenderId: "385628927398",
          appId: "1:385628927398:web:00239f1b2acebd6e790b67"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // [新] 核心清除邏輯 (不含確認視窗，給自動排程用)
        function executeClear(source) {
            console.log(`[${source}] 正在執行資料庫清空...`);
            
            Promise.all([
                database.ref("alerts").remove(),
                database.ref("queues").remove()
            ]).then(() => {
                console.log(`[${source}] ✅ 資料庫已成功清空！`);
                // 如果是手動按的，才跳 Alert
                if (source === 'Manual') {
                    alert("✅ 資料庫已成功清空！");
                }
            }).catch(err => {
                console.error(`[${source}] ❌ 清空失敗: ${err.message}`);
                if (source === 'Manual') {
                    alert(`❌ 清空失敗: ${err.message}`);
                }
            });
        }

        // 手動清除按鈕 (含確認)
        function manualClear() {
            if (!confirm("【嚴重警告】\n你確定要「永久刪除」所有資料嗎？\n\n這將會清空：\n1. 所有班級的等待學生\n2. 所有警衛室的訊息紀錄\n\n此動作無法復原！")) {
                return;
            }
            if (!confirm("請再次確認：真的要清空嗎？")) return;
            
            executeClear('Manual');
        }

        // [新] 自動排程邏輯
        // 為了防止同一分鐘內重複執行，我們使用一個標記
        let lastClearTimeStr = "";

        function checkSchedule() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // 更新畫面時鐘 (補零)
            const timeString = 
                String(hours).padStart(2, '0') + ":" + 
                String(minutes).padStart(2, '0') + ":" + 
                String(seconds).padStart(2, '0');
            document.getElementById('clock').innerText = timeString;

            // 檢查是否為 16:00 或 18:00
            // 我們檢查分鐘為 00，且秒數小於 2 (確保只觸發一次，但也避免瀏覽器卡頓錯過第0秒)
            if ((hours === 16 || hours === 18) && minutes === 0) {
                // 產生一個標記，例如 "16:00"
                const currentClearMark = `${hours}:${minutes}`;
                
                // 如果這個時間點還沒執行過
                if (lastClearTimeStr !== currentClearMark) {
                    executeClear(`Auto-${timeString}`);
                    lastClearTimeStr = currentClearMark; // 標記已執行，這一分鐘內不會再跑
                }
            }
        }

        // 每秒檢查一次
        setInterval(checkSchedule, 1000);
        // 立即執行一次以顯示時間
        checkSchedule();

    </script>
</body>
</html>
