<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級老師即時看板</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { 
            font-family: 'Microsoft JhengHei', Arial, sans-serif; 
            background-color: #f0f8ff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: #333; 
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* 連線狀態燈 */
        #connection-status {
            position: fixed; top: 15px; right: 15px;
            padding: 10px 20px; border-radius: 50px;
            font-size: 1rem; font-weight: bold;
            color: white; background-color: #ccc; 
            z-index: 200; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header { text-align: center; margin-bottom: 30px; margin-top: 40px; }
        .header h1 { margin: 0; font-size: 2.5em; color: #2c3e50; }
        .header p { color: #7f8c8d; font-size: 1.1em; }

        /* 卡片容器 */
        #queue-container {
            width: 100%; max-width: 900px;
            display: grid;
            grid-template-columns: 1fr; /* 手機版一欄 */
            gap: 20px;
        }
        @media (min-width: 768px) {
            #queue-container { grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); }
        }

        /* 學生卡片 */
        .student-card {
            background: white; padding: 25px; border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; 
            border-left: 10px solid #3498db; 
            animation: slideIn 0.5s ease;
            position: relative;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .info h2 { margin: 10px 0; font-size: 2em; color: #2c3e50; text-align: center; }
        .info .time { color: #95a5a6; font-size: 0.9em; text-align: center; margin-bottom: 20px;}

        /* 按鈕區 - 2x2 排列 */
        .actions { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-top: auto; 
        }

        .btn {
            border: none; padding: 15px 5px; border-radius: 8px;
            font-size: 1em; cursor: pointer; color: white;
            font-weight: bold; transition: transform 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn:active { transform: scale(0.95); }

        /* 四種按鈕顏色定義 */
        .btn-1 { background: #2ecc71; } /* 綠色：收拾書包 */
        .btn-2 { background: #f39c12; } /* 橘色：上廁所 */
        .btn-3 { background: #3498db; } /* 藍色：室外活動 */
        .btn-4 { background: #e74c3c; } /* 紅色：連絡家長 */

        .btn:hover { opacity: 0.9; }

        .empty-state { text-align: center; margin-top: 80px; color: #bdc3c7; }
        .empty-state i { font-size: 5em; display: block; margin-bottom: 20px; font-style: normal; }
    </style>
</head>
<body>

    <div id="connection-status">連線中...</div>

    <div class="header">
        <h1>班級即時看板</h1>
        <p>等待家長接送通知...</p>
    </div>

    <div id="queue-container"></div>

    <div id="empty-state" class="empty-state" style="display:none">
        <i>📭</i>
        <h2>目前沒有通知</h2>
    </div>

    <audio id="notification-sound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>

    <script>
        // --- 1. Firebase 設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyB_-fHCMhi-URwyBqzAIipmffWwvNgzJJc",
            authDomain: "qr-scanner-app-2c73d.firebaseapp.com",
            databaseURL: "https://qr-scanner-app-2c73d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "qr-scanner-app-2c73d",
            storageBucket: "qr-scanner-app-2c73d.firebasestorage.app",
            messagingSenderId: "385628927398",
            appId: "1:385628927398:web:00239f1b2acebd6e790b67"
        };
        
        // ★★★ 關鍵：請確認這裡還是您「最新部署」的 GAS 網址 ★★★
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";

        // 初始化 Firebase
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let studentQueue = [];
        let classQueueRef = null;

        // 取得網址參數
        const urlParams = new URLSearchParams(window.location.search);
        const className = urlParams.get('class');

        // 連線狀態監聽
        database.ref(".info/connected").on("value", (snap) => {
            const statusEl = document.getElementById('connection-status');
            if (snap.val() === true) {
                statusEl.innerText = "🟢 連線正常";
                statusEl.style.backgroundColor = "#27ae60";
            } else {
                statusEl.innerText = "🔴 断線重連中";
                statusEl.style.backgroundColor = "#e74c3c";
            }
        });

        // 啟動程式
        initClassListener();

        // 畫面更新
        function updateDisplay() {
            const container = document.getElementById('queue-container');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = '';

            if (studentQueue.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            // 排序：舊的在上面
            studentQueue.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            studentQueue.forEach(student => {
                const card = document.createElement('div');
                card.className = 'student-card';
                
                const time = new Date(student.timestamp).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

                // ★★★ 這裡就是您要的 4 個按鈕 ★★★
                card.innerHTML = `
                    <div class="info">
                        <div class="time">掃描時間: ${time}</div>
                        <h2>${student.name}</h2>
                    </div>
                    <div class="actions">
                        <button class="btn btn-1" onclick="handleResponse('${student.key}', '${student.name}', '收拾書包前往警衛室')">🎒 收拾書包<br>前往警衛室</button>
                        <button class="btn btn-2" onclick="handleResponse('${student.key}', '${student.name}', '上廁所請稍候')">🚽 上廁所<br>請稍候</button>
                        <button class="btn btn-3" onclick="handleResponse('${student.key}', '${student.name}', '班級在室外活動')">🌳 班級在<br>室外活動</button>
                        <button class="btn btn-4" onclick="handleResponse('${student.key}', '${student.name}', '老師另外連絡家長')">☎️ 老師另外<br>連絡家長</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- 核心回應功能 (維持之前成功的寫入邏輯) ---
        function handleResponse(key, name, responseText) {
            console.log(`準備回應: ${name}, 內容: ${responseText}`);

            // 1. 發送給 Google 試算表 (使用 text/plain 確保成功)
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    type: 'reply',       // 這是關鍵，後端只認這個 type
                    studentName: name,   
                    response: responseText // 這裡就是您按鈕上的文字
                })
            })
            .then(() => console.log("✅ 日誌請求已發送"))
            .catch(e => console.error("❌ 日誌發送失敗", e));

            // 2. 移除 Firebase 資料 (讓卡片消失)
            if (classQueueRef) {
                classQueueRef.child(key).remove();
            }
        }

        // 音效與語音
        function playNotificationSound() {
            document.getElementById('notification-sound').play().catch(()=>{});
        }
        function speak(text) {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'zh-TW'; u.rate = 1; 
                window.speechSynthesis.speak(u);
            }
        }

        // 初始化監聽
        function initClassListener() {
            if (!className) { 
                document.querySelector('.header p').innerText = "請在網址後加上 ?class=1A"; 
                return; 
            }
            document.querySelector('.header h1').innerText = `${className} 班即時看板`;
            
            classQueueRef = database.ref(`queues/${className}`);
            const startTime = new Date().toISOString();
            
            classQueueRef.orderByChild('timestamp').startAt(startTime).on('child_added', (snapshot) => {
                const data = snapshot.val();
                data.key = snapshot.key;

                if (!studentQueue.find(s => s.key === data.key)) {
                    studentQueue.push(data);
                    updateDisplay();
                    playNotificationSound();
                    setTimeout(() => speak(`${data.name}同學，家長來接囉`), 1000);
                }
            });

            classQueueRef.on('child_removed', (snapshot) => {
                studentQueue = studentQueue.filter(s => s.key !== snapshot.key);
                updateDisplay();
            });
        }
    </script>
</body>
</html>
