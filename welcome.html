<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級老師管理介面</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { 
            font-family: 'Microsoft JhengHei', Arial, sans-serif; 
            background-color: #f0f8ff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: #333; 
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* 連線狀態燈 */
        #connection-status {
            position: fixed; top: 15px; right: 15px;
            padding: 10px 20px; border-radius: 50px;
            font-size: 1rem; font-weight: bold;
            color: white; background-color: #ccc; 
            z-index: 200; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header { text-align: center; margin-bottom: 30px; margin-top: 40px; }
        .header h1 { margin: 0; font-size: 2.5em; color: #2c3e50; }
        .header p { color: #7f8c8d; font-size: 1.1em; }

        /* 卡片容器 */
        #queue-container {
            width: 100%; max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* 學生卡片 */
        .student-card {
            background: white; padding: 25px; border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; 
            border-left: 10px solid #3498db; 
            animation: slideIn 0.5s ease;
            position: relative;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .info h2 { margin: 10px 0; font-size: 2em; color: #2c3e50; text-align: center; }
        .info .time { color: #95a5a6; font-size: 0.9em; text-align: center; margin-bottom: 15px;}

        .actions { display: flex; gap: 10px; margin-top: auto; }
        .btn {
            border: none; padding: 12px 0; border-radius: 8px;
            font-size: 1.1em; cursor: pointer; color: white;
            font-weight: bold; transition: transform 0.1s;
            flex: 1;
        }
        .btn:active { transform: scale(0.95); }
        .btn-confirm { background: #2ecc71; }
        .btn-wait { background: #f1c40f; }

        .empty-state { text-align: center; margin-top: 80px; color: #bdc3c7; }
        .empty-state i { font-size: 5em; display: block; margin-bottom: 20px; font-style: normal; }
    </style>
</head>
<body>

    <div id="connection-status">連線中...</div>

    <div class="header">
        <h1>班級即時看板</h1>
        <p>等待家長接送通知...</p>
    </div>

    <div id="queue-container"></div>

    <div id="empty-state" class="empty-state" style="display:none">
        <i>📭</i>
        <h2>目前沒有通知</h2>
    </div>

    <audio id="notification-sound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>

    <script>
        // --- 1. Firebase 設定 (請保持原樣) ---
        const firebaseConfig = {
            apiKey: "AIzaSyB_-fHCMhi-URwyBqzAIipmffWwvNgzJJc",
            authDomain: "qr-scanner-app-2c73d.firebaseapp.com",
            databaseURL: "https://qr-scanner-app-2c73d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "qr-scanner-app-2c73d",
            storageBucket: "qr-scanner-app-2c73d.firebasestorage.app",
            messagingSenderId: "385628927398",
            appId: "1:385628927398:web:00239f1b2acebd6e790b67"
        };
        
        // --- 2. ★★★ 關鍵修改：請填入您最新的 GAS 網址 ★★★ ---
        // 只有填了這個，日誌才會收到老師的回應
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";

        // 初始化 Firebase
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let studentQueue = [];
        let classQueueRef = null;

        // 取得網址參數 (例如 ?class=1A)
        const urlParams = new URLSearchParams(window.location.search);
        const className = urlParams.get('class');

        // 連線狀態監聽
        database.ref(".info/connected").on("value", (snap) => {
            const statusEl = document.getElementById('connection-status');
            if (snap.val() === true) {
                statusEl.innerText = "🟢 連線正常";
                statusEl.style.backgroundColor = "#27ae60";
            } else {
                statusEl.innerText = "🔴 断線重連中";
                statusEl.style.backgroundColor = "#e74c3c";
            }
        });

        // 啟動程式
        initClassListener();

        // 畫面更新函式
        function updateDisplay() {
            const container = document.getElementById('queue-container');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = '';

            if (studentQueue.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            // 依照時間排序
            studentQueue.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            studentQueue.forEach(student => {
                const card = document.createElement('div');
                card.className = 'student-card';
                
                const time = new Date(student.timestamp).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

                // 產生卡片內容
                card.innerHTML = `
                    <div class="info">
                        <div class="time">掃描時間: ${time}</div>
                        <h2>${student.name}</h2>
                    </div>
                    <div class="actions">
                        <button class="btn btn-confirm" onclick="handleResponse('${student.key}', '${student.name}', '已確認')">⭕ 已確認</button>
                        <button class="btn btn-wait" onclick="handleResponse('${student.key}', '${student.name}', '請稍候')">✋ 請稍候</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- 3. ★★★ 核心修正：按下按鈕時，同時通知 GAS ★★★ ---
        function handleResponse(key, name, responseText) {
            console.log(`準備回應: ${name}, 內容: ${responseText}`);

            // 步驟 A: 發送訊號給 Google 試算表 (寫入日誌)
            // 使用 text/plain 格式，這是最不容易被瀏覽器擋下的方式
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    type: 'reply',       // 告訴後端：這是一則回應
                    studentName: name,   // 學生名字
                    response: responseText // 回應內容
                })
            })
            .then(() => console.log("✅ 日誌寫入請求已發送"))
            .catch(e => console.error("❌ 日誌寫入失敗 (請檢查網址)", e));

            // 步驟 B: 移除 Firebase 資料 (讓看板上的卡片消失)
            if (classQueueRef) {
                classQueueRef.child(key).remove()
                    .then(() => console.log("✅ Firebase 移除成功"))
                    .catch(() => alert("Firebase 連線異常"));
            }
        }

        // 音效與語音
        function playNotificationSound() {
            document.getElementById('notification-sound').play().catch(()=>{});
        }
        function speak(text) {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'zh-TW'; u.rate = 1; 
                window.speechSynthesis.speak(u);
            }
        }

        // 初始化監聽
        function initClassListener() {
            if (!className) { 
                document.querySelector('.header p').innerText = "請在網址後加上 ?class=1A"; 
                return; 
            }
            document.querySelector('.header h1').innerText = `${className} 班即時看板`;
            
            classQueueRef = database.ref(`queues/${className}`);
            
            // 監聽新資料
            const startTime = new Date().toISOString();
            classQueueRef.orderByChild('timestamp').startAt(startTime).on('child_added', (snapshot) => {
                const data = snapshot.val();
                data.key = snapshot.key; // 記住這個 key 才能刪除

                // 避免重複顯示
                if (!studentQueue.find(s => s.key === data.key)) {
                    studentQueue.push(data);
                    updateDisplay();
                    playNotificationSound();
                    setTimeout(() => speak(`${data.name}同學，家長來接囉`), 1000);
                }
            });

            // 監聽刪除資料 (同步多個螢幕)
            classQueueRef.on('child_removed', (snapshot) => {
                studentQueue = studentQueue.filter(s => s.key !== snapshot.key);
                updateDisplay();
            });
        }
    </script>
</body>
</html>
