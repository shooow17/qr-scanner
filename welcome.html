<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警衛室即時看板 (靜音修正版)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #E8F5E9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; color: #333; }
        
        /* 隱藏輸入框 */
        #scannerInput { opacity: 0; position: absolute; top: -9999px; }

        .container { background-color: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); width: 95%; max-width: 1200px; display: flex; flex-direction: column; gap: 15px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #E8F5E9; padding-bottom: 10px; }
        h1 { font-size: 1.8em; margin: 0; color: #1B5E20; }
        .loading-bar { background: #fff3cd; color: #856404; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9em; }
        .loading-bar.ready { background: #d4edda; color: #155724; }
        
        #alert-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; width: 100%; }
        .alert-item { padding: 8px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; height: 95px; position: relative; line-height: 1.2; text-align: left; }
        .alert-item.newest { background: #fff3e0; border: 3px solid #ff5722; animation: flash 1.5s infinite; transform: scale(1.02); z-index: 10; }
        .alert-item.normal { background: #f5f5f5; border: 1px solid #bdbdbd; }
        .placeholder { background: #fdfdfd; border: 1px dashed #A5D6A7; color: #ccc; align-items: center; justify-content: center; font-size: 1.2em; display: flex; }
        @keyframes flash { 0%,100% { border-color:#ff5722; } 50% { border-color:#ffccbc; } }
        
        .delete-btn { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; background: rgba(255,255,255,0.8); border-radius: 50%; text-align: center; cursor: pointer; color: #aaa; font-weight: bold; }
        .delete-btn:hover { background: #d84315; color: white; }
        .alert-message .student-name { color: #388E3C; font-size: 1.2em; font-weight: bold; display: block; margin-bottom: 2px; }
        .alert-message .status { color: #d84315; font-size: 0.9em; font-weight: bold; }
        .alert-time { font-size: 0.8em; color: #777; margin-top: 3px; display: block; }
        
        .controls { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding-top: 15px; border-top: 2px solid #eee; }
        .controls button { border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; color: white; }
        #btn-export { background: #00796b; } #btn-clear { background: #FF9800; }
        
        /* 彈窗 */
        #scanOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); z-index: 999; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.2s; backdrop-filter: blur(4px); }
        #scanOverlay.show { opacity: 1; visibility: visible; }
        .overlay-card { background: white; padding: 40px 50px; border-radius: 20px; text-align: center; transform: scale(0.8); transition: 0.2s; min-width: 350px; }
        #scanOverlay.show .overlay-card { transform: scale(1); }
        .overlay-card.success { border: 8px solid #28a745; background: #f0fff4; color: #155724; }
        .overlay-card.error { border: 8px solid #dc3545; background: #fff5f5; color: #721c24; }
        .overlay-card .icon { font-size: 5em; display: block; margin-bottom: 10px; }
        .overlay-card .main-text { font-size: 3em; font-weight: 900; margin: 10px 0; }
        .overlay-card .sub-text { font-size: 1.6em; background: #333; color: white; padding: 8px 30px; border-radius: 50px; display: inline-block; margin-top: 15px; }

        @media (max-width: 1024px) { #alert-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { #alert-grid { grid-template-columns: 1fr; } .container { width: 90%; } }
    </style>
</head>
<body>
    <input type="password" id="scannerInput" autocomplete="off" />
    
    <audio id="scanSound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>
    <audio id="errorSound" src="https://www.soundjay.com/buttons/beep-05.mp3"></audio>

    <div id="scanOverlay"><div id="overlayCard" class="overlay-card"><span class="icon" id="overlayIcon"></span><div class="main-text" id="overlayMainText"></div><div class="sub-text" id="overlaySubText"></div></div></div>

    <div class="container">
        <div class="header-bar"><h1>警衛室即時看板</h1><div id="loadingStatus" class="loading-bar">⏳ 下載名單中...</div></div>
        <div id="alert-grid"></div>
        <div class="controls">
            <div style="margin-right:auto;color:#888;font-weight:bold;">● 系統運作中 (靜音修正版)</div>
            <button id="btn-export" onclick="exportReport()">匯出報表</button>
            <button id="btn-clear" onclick="clearLocalScreen()">清除畫面</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyB_-fHCMhi-URwyBqzAIipmffWwvNgzJJc",
          authDomain: "qr-scanner-app-2c73d.firebaseapp.com",
          databaseURL: "https://qr-scanner-app-2c73d-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "qr-scanner-app-2c73d",
          storageBucket: "qr-scanner-app-2c73d.firebasestorage.app",
          messagingSenderId: "385628927398",
          appId: "1:385628927398:web:00239f1b2acebd6e790b67"
        };
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const alertsRef = database.ref("alerts");
        const queuesRef = database.ref("queues");
        
        const MAX_ALERTS = 15; 
        let alertHistory = []; 
        let allStudents = [];
        let isDataReady = false;
        let overlayTimer = null;
        let lockTimer = null;
        let isLocked = false;

        document.addEventListener('DOMContentLoaded', () => {
            setupAlertListener();
            fetchStudentList();
            setupScannerInput();
            keepFocus();
            document.addEventListener('click', () => setTimeout(keepFocus, 200));
        });

        // --- 核心功能：注音轉英數對照表 ---
        const bopomofoMap = {
            'ㄅ':'1', 'ㄆ':'q', 'ㄇ':'a', 'ㄈ':'z', 'ㄉ':'2', 'ㄊ':'w', 'ㄋ':'s', 'ㄌ':'x',
            'ˇ':'3', 'ㄍ':'e', 'ㄎ':'d', 'ㄏ':'c', 'ˋ':'4', 'ㄐ':'r', 'ㄑ':'f', 'ㄒ':'v',
            'ㄓ':'5', 'ㄔ':'t', 'ㄕ':'g', 'ㄖ':'b', 'ˊ':'6', 'ㄗ':'y', 'ㄘ':'h', 'ㄙ':'n',
            '˙':'7', 'ㄧ':'u', 'ㄨ':'j', 'ㄩ':'m', 'ㄚ':'8', 'ㄛ':'i', 'ㄜ':'k', 'ㄝ':',',
            'ㄞ':'9', 'ㄟ':'o', 'ㄠ':'l', 'ㄡ':'.', 'ㄢ':'0', 'ㄣ':'p', 'ㄤ':';', 'ㄥ':'/',
            'ㄦ':'-', '？':'/', '，':',', '。':'.', '－':'-', '＝':'='
        };

        function fixGarbledInput(str) {
            // 1. 全形轉半形
            let halfStr = str.replace(/[\uff01-\uff5e]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace(/\u3000/g, ' ');
            
            // 2. 注音轉英數
            let result = '';
            for (let char of halfStr) {
                result += bopomofoMap[char] || char;
            }
            return result.toUpperCase().trim();
        }

        // --- 核心功能：輸入監聽與消音 ---
        function setupScannerInput() {
            const input = document.getElementById('scannerInput');
            
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    // ★★★ 這裡就是消音的關鍵 ★★★
                    // 告訴瀏覽器：這個 Enter 鍵我處理完了，不要發出錯誤音！
                    e.preventDefault();
                    e.stopPropagation();

                    let content = this.value.trim();
                    this.value = ''; 
                    
                    if (content.length > 0) {
                        // 處理輸入資料 (含注音修正)
                        processScan(fixGarbledInput(content));
                    }
                }
            });
            
            // 補強：處理注音輸入法組字結束的情況
            input.addEventListener('compositionend', function(e) {
                let content = this.value.trim();
                this.value = '';
                if (content.length > 0) {
                    processScan(fixGarbledInput(content));
                }
            });

            input.addEventListener('blur', () => setTimeout(keepFocus, 100));
        }

        function keepFocus() { document.getElementById('scannerInput').focus(); }

        // --- 掃描處理 ---
        function processScan(rawInput) {
            if (isLocked) return;
            if (!isDataReady) return alert("名單下載中...");

            // 支援 123-姓名 或 純 123 格式
            const searchId = rawInput.split('-')[0].trim();
            
            // 搜尋學生
            const student = allStudents.find(s => String(s.id || s['學號'] || '') === searchId);

            if (student) {
                playAudio('scanSound');
                
                const studentClass = student['班級'] || student['class'] || student['className'] || student['grade'] || "(未分班)";
                const studentName = student['姓名'] || student['name'] || "未知姓名";

                showOverlay("success", studentName, studentClass);
                pushToFirebaseQueue(studentName, studentClass, searchId);
                logToGAS(studentName, studentClass);
                
                isLocked = true;
                if(lockTimer) clearTimeout(lockTimer);
                lockTimer = setTimeout(() => { isLocked = false; }, 1000);
            } else {
                playAudio('errorSound');
                showOverlay("error", "查無此人", searchId);
                isLocked = true;
                if(lockTimer) clearTimeout(lockTimer);
                lockTimer = setTimeout(() => { isLocked = false; }, 1000);
            }
        }

        // --- 其他輔助函式 ---
        function fetchStudentList() {
            const statusEl = document.getElementById('loadingStatus');
            fetch(`${GOOGLE_SCRIPT_URL}?op=students`)
                .then(res => res.json())
                .then(data => {
                    allStudents = data;
                    isDataReady = true;
                    statusEl.textContent = `✅ 已更新 (${data.length}人)`;
                    statusEl.classList.add('ready');
                })
                .catch(err => { statusEl.textContent = "❌ 下載失敗"; });
        }

        function showOverlay(type, nameText, classText) {
            const overlay = document.getElementById('scanOverlay');
            const card = document.getElementById('overlayCard');
            const icon = document.getElementById('overlayIcon');
            const mainEl = document.getElementById('overlayMainText');
            const subEl = document.getElementById('overlaySubText');

            if (type === 'success') {
                card.className = "overlay-card success";
                icon.textContent = "✅";
                mainEl.textContent = `${nameText} ${classText}`;
                subEl.textContent = "已發送訊息到班上";
            } else {
                card.className = "overlay-card error";
                icon.textContent = "⚠️";
                mainEl.textContent = nameText; 
                subEl.textContent = "請確認條碼";
            }

            overlay.classList.add('show');
            if (overlayTimer) clearTimeout(overlayTimer);
            overlayTimer = setTimeout(() => { overlay.classList.remove('show'); }, 3000);
        }

        function pushToFirebaseQueue(name, className, id) {
            const targetPath = (className && className !== "(未分班)") ? `queues/${className}` : `queues/unknown`;
            database.ref(targetPath).push().set({
                id: id,
                name: name,
                studentName: name,
                class: className,
                className: className,
                timestamp: new Date().toISOString(),
                status: 'waiting'
            });
        }

        function logToGAS(name, className) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST", body: JSON.stringify({ type: 'scan', content: `${name} (${className})` }),
                headers: { "Content-Type": "text/plain" }
            }).catch(e => console.error("Log error", e));
        }

        function playAudio(id) {
            const audio = document.getElementById(id);
            if (audio) audio.play().catch(e => {});
        }

        // --- 顯示功能 ---
        function setupAlertListener() {
            alertsRef.limitToLast(MAX_ALERTS).on('child_added', (snapshot) => {
                const alertData = snapshot.val();
                alertData.key = snapshot.key; 
                alertHistory.push(alertData); 
                renderGrid(); 
            });
            alertsRef.on('value', (snapshot) => {
                if (!snapshot.exists()) { alertHistory = []; renderGrid(); }
            });
            alertsRef.on('child_removed', (snapshot) => {
                alertHistory = alertHistory.filter(item => item.key !== snapshot.key);
                renderGrid();
            });
            renderGrid();
        }

        function maskName(n) {
            if (!n) return "";
            if (n.length <= 1) return n;
            if (n.length === 2) return n.substring(0, 1) + "O";
            let masked = n.substring(0, 1);
            masked += "O".repeat(n.length - 2);
            masked += n.substring(n.length - 1);
            return masked;
        }

        function renderGrid() {
            const gridElement = document.getElementById('alert-grid');
            gridElement.innerHTML = ''; 
            const itemsToDisplay = alertHistory.slice(-MAX_ALERTS).reverse();
            for (let i = 0; i < MAX_ALERTS; i++) {
                const item = itemsToDisplay[i];
                const cell = document.createElement('div');
                if (item) {
                    cell.className = (i === 0) ? 'alert-item newest' : 'alert-item normal';
                    const localTime = new Date(item.timestamp).toLocaleString('zh-TW', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
                    cell.innerHTML = `<div class="delete-btn" onclick="deleteAlert('${item.key}')">×</div><div class="alert-message"><span class="student-name">${maskName(item.name)} (${item.class || '未分班'})</span><span class="status">${item.status}</span></div><span class="alert-time">${localTime}</span>`;
                } else {
                    cell.className = 'alert-item placeholder';
                    cell.textContent = '---'; 
                }
                gridElement.appendChild(cell);
            }
        }
        function deleteAlert(key) { if (!confirm("刪除此訊息？")) return; if (key) alertsRef.child(key).remove(); keepFocus(); }
        function clearLocalScreen() { if (!confirm("清除畫面資料？")) return; alertHistory = []; renderGrid(); keepFocus(); }
        function exportReport() {
            if (alertHistory.length === 0) return alert("無資料");
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF時間,班級,姓名,狀態\r\n";
            [...alertHistory].reverse().forEach(item => {
                const time = new Date(item.timestamp).toLocaleString('zh-TW');
                csvContent += `"${time}","${item.class || ''}","${item.name}","${item.status}"\r\n`;
            });
            const link = document.createElement("a"); link.href = encodeURI(csvContent); link.download = `報表_${new Date().toISOString().split('T')[0]}.csv`; link.click(); keepFocus();
        }
    </script>
</body>
</html>
