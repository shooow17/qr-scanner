    <title>班級老師即時看板</title>

    <style>
        body { 
            font-family: 'Microsoft JhengHei', Arial, sans-serif; 
            background-color: #f0f8ff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: #333; 
            padding: 10px;
            box-sizing: border-box;
        }
        
        #connection-status {
            position: fixed; top: 10px; right: 10px;
            padding: 8px 15px; border-radius: 50px;
            font-size: 0.9rem; font-weight: bold;
            color: white; background-color: #ccc; 
            z-index: 200; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header { text-align: center; margin-bottom: 20px; margin-top: 30px; }
        .header h1 { margin: 0; font-size: 2em; color: #2c3e50; }
        .header p { color: #7f8c8d; font-size: 1em; margin-top: 5px; }

        #queue-container {
            width: 100%; max-width: 900px;
            display: flex; 
            flex-direction: column; 
            gap: 15px;
        }

        .student-card {
            background: white; padding: 15px 20px; border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; 
            border-left: 8px solid #3498db; 
            animation: slideIn 0.5s ease;
            position: relative;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .info { 
            display: flex; 
            justify-content: space-between; 
            align-items: baseline;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .info h2 { margin: 0; font-size: 1.8em; color: #2c3e50; }
        .info .time { color: #95a5a6; font-size: 0.9em; }

        .actions { 
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .btn {
            border: none; 
            padding: 10px 2px;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer; color: white;
            font-weight: bold; 
            transition: transform 0.1s, opacity 0.1s;
            flex: 1;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            line-height: 1.2;
        }
        .btn:active { transform: scale(0.95); }
        .btn:hover { opacity: 0.9; }

        .btn-1 { background: #2ecc71; } 
        .btn-2 { background: #f39c12; } 
        .btn-3 { background: #3498db; } 
        .btn-4 { background: #e74c3c; } 

        .empty-state { text-align: center; margin-top: 80px; color: #bdc3c7; }
        .empty-state i { font-size: 5em; display: block; margin-bottom: 20px; font-style: normal; }
        
        /* 加入一個啟動遮罩，確保音效能正常播放 */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 999;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        #start-overlay div {
            background: white; padding: 30px; border-radius: 15px;
            text-align: center; font-size: 1.5em; font-weight: bold;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        @media (max-width: 400px) {
            .btn { font-size: 0.8em; padding: 8px 0; }
            .info h2 { font-size: 1.5em; }
        }
    </style>
</head>

AAAACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAA//uQZEAAA9hW1FMsJFAAAAAaQAAAAAAAB4AAAAgAAAABAAAAAAACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAA//uQZEAAA9hW1FMsJFAAAAAaQAAAAAAAB4AAAAgAAAABAAAAAAACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAAIAAgACAA";

        // 預先載入音效
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let audioBuffer = null;

        function enableAudio() {
            // 點擊後啟用音效環境
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            // 移除遮罩
            document.getElementById('start-overlay').style.display = 'none';
            // 播放一次靜音以解鎖 iOS/Android 限制
            playTone(0, 0);
        }

        // 解碼 Base64
        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64.split(',')[1]);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // 載入音訊
        audioContext.decodeAudioData(base64ToArrayBuffer(dingDongBase64), (buffer) => {
            audioBuffer = buffer;
        });

        function playTone(freq, duration) {
            // 這裡不發出聲音，只為了觸發 AudioContext
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            gain.gain.value = 0;
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.01);
        }

        function playDingDong() {
            if (audioBuffer) {
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);
                source.start(0);
            }
        }

        database.ref(".info/connected").on("value", s => { 
            document.getElementById('connection-status').innerText = s.val() ? "🟢 連線正常" : "🔴 断線重連中"; 
            document.getElementById('connection-status').style.backgroundColor = s.val() ? "#27ae60" : "#e74c3c"; 
        });

        initClassListener();

        function updateDisplay() {
            const container = document.getElementById('queue-container');
            container.innerHTML = '';
            if (!studentQueue.length) { document.getElementById('empty-state').style.display = 'block'; return; }
            document.getElementById('empty-state').style.display = 'none';
            studentQueue.sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
            studentQueue.forEach(s => {
                const card = document.createElement('div'); card.className = 'student-card';
                const sClass = s.class || className || "未分班";
                card.innerHTML = `<div class="info"><h2>${s.name}</h2><div class="time">掃描: ${new Date(s.timestamp).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</div></div>
                <div class="actions">
                    <button class="btn btn-1" onclick="handleResponse('${s.key}','${s.name}','${sClass}','收拾書包前往警衛室')">📗<br>收拾書包</button>
                    <button class="btn btn-2" onclick="handleResponse('${s.key}','${s.name}','${sClass}','上廁所請稍候')">🚽<br>上廁所</button>
                    <button class="btn btn-3" onclick="handleResponse('${s.key}','${s.name}','${sClass}','班級在室外活動')">⚽️<br>室外活動</button>
                    <button class="btn btn-4" onclick="handleResponse('${s.key}','${s.name}','${sClass}','老師另外連絡家長')">📲<br>另約家長</button>
                </div>`;
                container.appendChild(card);
            });
        }

        function handleResponse(key, name, sClass, responseText) {
            fetch(GOOGLE_SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ type: 'reply', studentName: name, response: responseText }) }).catch(e=>console.error(e));
            alertsRef.push({ name: name, class: sClass, status: responseText, timestamp: new Date().toISOString() });
            if (classQueueRef) classQueueRef.child(key).remove();
        }

        function initClassListener() {
            if (!className) { document.querySelector('.header p').innerText = "請在網址後加上 ?class=1A"; return; }
            document.querySelector('.header h1').innerText = `${className} 班即時看板`;
            classQueueRef = database.ref(`queues/${className}`);
            const startTime = new Date(Date.now() - 12 * 60 * 60 * 1000).toISOString();
            
            classQueueRef.orderByChild('timestamp').startAt(startTime).on('child_added', snapshot => {
                const data = snapshot.val(); data.key = snapshot.key;
                if (!studentQueue.find(s => s.key === data.key)) {
                    studentQueue.push(data); updateDisplay();
                    
                    // ★★★ 改用優化後的播放函式 ★★★
                    playDingDong();
                    
                    // 稍微延遲語音，避免聲音重疊或產生雜訊
                    if('speechSynthesis' in window) { 
                        setTimeout(() => {
                            const u = new SpeechSynthesisUtterance(`${data.name}同學，家長來接囉`); 
                            u.lang='zh-TW'; 
                            window.speechSynthesis.speak(u); 
                        }, 1500);
                    }
                }
            });
            classQueueRef.on('child_removed', snapshot => { studentQueue = studentQueue.filter(s => s.key !== snapshot.key); updateDisplay(); });
        }
    </script>
</body>
</html>
