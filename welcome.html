<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級即時顯示</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f8ff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: #333; 
            padding: 20px;
            box-sizing: border-box;
        }
        
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #005a9c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            cursor: pointer;
            z-index: 100;
        }
        #start-overlay.hidden {
            display: none;
        }

        /* 標題區 */
        .header {
            margin-bottom: 20px;
            text-align: center;
        }
        h1 { font-size: 2em; margin: 0; color: #005a9c; }
        
        /* 學生列表容器 */
        #student-list {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 單一學生卡片 */
        .student-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            display: flex;
            flex-direction: column; /* 手機版預設垂直排列 */
            border-left: 10px solid #4CAF50; /* 綠色左邊條 */
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 學生資訊區 */
        .student-info {
            margin-bottom: 15px;
        }
        .student-name {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }
        .student-id {
            color: #666;
            font-size: 1.1em;
        }

        /* 按鈕區 */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 兩欄 */
            gap: 10px;
        }
        
        /* 電腦版樣式調整 */
        @media (min-width: 600px) {
            .student-card {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
            .student-info {
                margin-bottom: 0;
                margin-right: 20px;
                min-width: 150px;
            }
            .action-buttons {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button.btn-red { background-color: #dc3545; }
        button.btn-red:hover { background-color: #a71d2a; }
        
        /* 按下後的樣式 */
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            color: #666;
        }

        /* 等待中訊息 */
        .empty-message {
            text-align: center;
            font-size: 1.5em;
            color: #888;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div id="start-overlay" onclick="startApp()">
        點擊此處開始監聽班級
    </div>

    <div class="header">
        <h1 id="class-title">班級即時看板</h1>
        <p>等待家長掃描中...</p>
    </div>

    <div id="student-list"></div>

    <script>
        // --- 1. 你的 Google Apps Script (GAS) 網址 ---
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";

        // --- 2. 你的 Firebase 設定 ---
        const firebaseConfig = {
          apiKey: "AIzaSyB_-fHCMhi-URwyBqzAIipmffWwvNgzJJc",
          authDomain: "qr-scanner-app-2c73d.firebaseapp.com",
          databaseURL: "https://qr-scanner-app-2c73d-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "qr-scanner-app-2c73d",
          storageBucket: "qr-scanner-app-2c73d.firebasestorage.app",
          messagingSenderId: "385628927398",
          appId: "1:385628927398:web:00239f1b2acebd6e790b67"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        const GUARD_ALERTS_KEY = "alerts"; 
        let classQueueRef = null; 
        
        let studentQueue = []; // 儲存所有等待中的學生
        let audioCtx; 

        // Web Audio API 音效
        function playNotificationSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(900, audioCtx.currentTime);
            osc.frequency.setValueAtTime(700, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // 更新畫面 (顯示前 5 筆)
        function updateDisplay() {
            const listContainer = document.getElementById('student-list');
            listContainer.innerHTML = ''; // 清空目前的列表

            if (studentQueue.length === 0) {
                listContainer.innerHTML = '<div class="empty-message">目前沒有家長掃描</div>';
                return;
            }

            // 只取前 5 筆
            const displayStudents = studentQueue.slice(0, 5);

            displayStudents.forEach((student, index) => {
                const card = document.createElement('div');
                card.className = 'student-card';
                
                // 建立卡片內容
                // 注意：我們把學生的 Firebase Key 傳給按鈕的 onclick 事件
                card.innerHTML = `
                    <div class="student-info">
                        <div class="student-name">${student.name}</div>
                        <div class="student-id">家長已掃描</div>
                    </div>
                    <div class="action-buttons">
                        <button onclick="handleAction('${student.key}', '${student.name}', '${student.class}', '收拾書包前往警衛室', this)">收拾書包</button>
                        <button onclick="handleAction('${student.key}', '${student.name}', '${student.class}', '上廁所請稍候', this)">上廁所</button>
                        <button onclick="handleAction('${student.key}', '${student.name}', '${student.class}', '班級在室外活動', this)">室外活動</button>
                        <button class="btn-red" onclick="handleAction('${student.key}', '${student.name}', '${student.class}', '老師另外連絡家長', this)">另約家長</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 處理按鈕點擊
        async function handleAction(key, name, sClass, status, btnElement) {
            // 1. 視覺回饋：鎖定該學生的所有按鈕
            const card = btnElement.closest('.student-card');
            const buttons = card.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);
            btnElement.innerText = "處理中...";

            console.log(`處理學生: ${name}, 動作: ${status}`);

            // 準備資料
            const now = new Date().toISOString();
            const guardData = { name: name, class: sClass, status: status, timestamp: now };
            const logData = { scan_time: getScanTime(key), class: sClass, name: name, status: status, response_time: now };

            try {
                // 2. 寫入 Google Sheet (不等待)
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(logData)
                }).catch(e => console.error("GAS Error:", e));

                // 3. 寫入 Firebase Alerts (給警衛)
                await database.ref(GUARD_ALERTS_KEY).push(guardData);

                // 4. 從 Firebase Queues 刪除該學生 (這會觸發 child_removed)
                await classQueueRef.child(key).remove();
                
                // (注意：畫面更新會由 child_removed 事件自動處理)

            } catch (err) {
                alert("連線錯誤，請重試");
                buttons.forEach(b => b.disabled = false);
                btnElement.innerText = status.substring(0, 4); // 恢復文字
            }
        }
        
        // 輔助：嘗試從本地佇列找回掃描時間 (非必要，僅供日誌用)
        function getScanTime(key) {
            const found = studentQueue.find(s => s.key === key);
            return found ? found.timestamp : new Date().toISOString();
        }

        // 啟動程式
        function startApp() {
            document.getElementById('start-overlay').classList.add('hidden');
            
            // 初始化音效
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
            } catch(e) { console.error("Audio Init Error"); }

            const urlParams = new URLSearchParams(window.location.search);
            const className = urlParams.get('class');
            
            if (!className) {
                document.getElementById('class-title').innerText = "錯誤：未指定班級";
                return;
            }

            document.getElementById('class-title').innerText = `${className} 班即時看板`;
            classQueueRef = database.ref(`queues/${className}`);

            // 只監聽現在之後的資料
            const startTime = new Date().toISOString();
            
            // 監聽新增
            classQueueRef.orderByChild('timestamp').startAt(startTime).on('child_added', (snapshot) => {
                const studentData = snapshot.val();
                studentData.key = snapshot.key;

                // 防止重複 (如果佇列裡已經有這個 ID，就不加了)
                if (!studentQueue.some(s => s.id === studentData.id)) {
                    studentQueue.push(studentData);
                    updateDisplay();
                    playNotificationSound(); // 每來一個新學生就響一次
                }
            });

            // 監聽刪除 (當 handleAction 成功刪除 Firebase 資料時觸發)
            classQueueRef.on('child_removed', (snapshot) => {
                // 從本地佇列移除該學生
                studentQueue = studentQueue.filter(s => s.key !== snapshot.key);
                updateDisplay();
            });
            
            updateDisplay();
        }
    </script>
</body>
</html>
