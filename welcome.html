<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級即時顯示介面</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f8ff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: #333; 
            padding: 20px;
            box-sizing: border-box;
        }
        
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #005a9c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            cursor: pointer;
            z-index: 100;
            transition: opacity 0.5s;
        }
        #start-overlay.hidden {
            display: none;
        }

        .header { margin-bottom: 20px; text-align: center; }
        h1 { font-size: 2em; margin: 0; color: #005a9c; }
        
        /* 學生列表容器 */
        #student-list {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 單一學生卡片 */
        .student-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            display: flex;
            flex-direction: column; 
            border-left: 10px solid #4CAF50; 
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .student-info { margin-bottom: 15px; }
        .student-name { font-size: 1.8em; font-weight: bold; color: #333; }
        .student-id { color: #666; font-size: 1.1em; }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 10px;
        }
        
        @media (min-width: 600px) {
            .student-card { flex-direction: row; align-items: center; justify-content: space-between; }
            .student-info { margin-bottom: 0; margin-right: 20px; min-width: 150px; }
            .action-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
        }

        button {
            background-color: #007bff; color: white; border: none; padding: 10px 15px;
            border-radius: 6px; font-size: 1em; cursor: pointer; white-space: nowrap;
        }
        button:hover { background-color: #0056b3; }
        button.btn-red { background-color: #dc3545; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        .empty-message { text-align: center; font-size: 1.5em; color: #888; margin-top: 50px; }
    </style>
</head>
<body>
    <div id="start-overlay" onclick="startApp()">
        點擊此處開始連線班級
    </div>

    <div class="header">
        <h1 id="class-title">班級即時看板</h1>
        <p>等待家長掃描中...</p>
    </div>

    <div id="student-list"></div>

    <script>
        // --- 設定 ---
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";
        const firebaseConfig = {
          apiKey: "AIzaSyB_-fHCMhi-URwyBqzAIipmffWwvNgzJJc",
          authDomain: "qr-scanner-app-2c73d.firebaseapp.com",
          databaseURL: "https://qr-scanner-app-2c73d-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "qr-scanner-app-2c73d",
          storageBucket: "qr-scanner-app-2c73d.firebasestorage.app",
          messagingSenderId: "385628927398",
          appId: "1:385628927398:web:00239f1b2acebd6e790b67"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        const GUARD_ALERTS_KEY = "alerts"; 
        let classQueueRef = null; 
        let studentQueue = []; 
        let audioCtx; 

        // 音效
        function playNotificationSound() {
            if (!audioCtx) return;
            const play = () => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.setValueAtTime(700, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.4);
            };
            play();
            setTimeout(play, 600);
        }

        // 更新畫面 (顯示前5筆)
        function updateDisplay() {
            const list = document.getElementById('student-list');
            list.innerHTML = ''; 

            if (studentQueue.length === 0) {
                list.innerHTML = '<div class="empty-message">目前沒有家長掃描</div>';
                return;
            }

            studentQueue.slice(0, 5).forEach(student => {
                const card = document.createElement('div');
                card.className = 'student-card';
                // 每個按鈕都綁定該學生的 key
                card.innerHTML = `
                    <div class="student-info">
                        <div class="student-name">${student.name}</div>
                        <div class="student-id">家長已掃描</div>
                    </div>
                    <div class="action-buttons">
                        <button onclick="handleAction('${student.key}', '${student.name}', '${student.class}', '收拾書包前往警衛室', this)">收拾書包</button>
                        <button onclick="handleAction('${student.key}', '${student.name}', '${student.class}', '上廁所請稍候', this)">上廁所</button>
                        <button onclick="handleAction('${student.key}', '${student.name}', '${student.class}', '班級在室外活動', this)">室外活動</button>
                        <button class="btn-red" onclick="handleAction('${student.key}', '${student.name}', '${student.class}', '老師另外連絡家長', this)">另約家長</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // 處理動作
        async function handleAction(key, name, sClass, status, btnElement) {
            // 視覺回饋：鎖定該學生的所有按鈕
            const card = btnElement.closest('.student-card');
            card.querySelectorAll('button').forEach(b => b.disabled = true);
            btnElement.innerText = "處理中...";

            const now = new Date().toISOString();
            const guardData = { name: name, class: sClass, status: status, timestamp: now };
            
            // 為了日誌，我們需要嘗試找回原始掃描時間
            const studentObj = studentQueue.find(s => s.key === key);
            const scanTime = studentObj ? studentObj.timestamp : now;
            
            const logData = { scan_time: scanTime, class: sClass, name: name, status: status, response_time: now };

            try {
                // 1. 寫入 GAS (不等待)
                fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(logData) }).catch(e => console.error(e));

                // 2. 寫入 Firebase Alerts (警衛)
                await database.ref(GUARD_ALERTS_KEY).push(guardData);

                // 3. 從佇列刪除 (這會觸發 child_removed 更新畫面)
                await classQueueRef.child(key).remove();

            } catch (err) {
                alert("失敗: " + err.message);
                card.querySelectorAll('button').forEach(b => b.disabled = false);
                btnElement.innerText = status.substring(0, 4);
            }
        }

        function startApp() {
            document.getElementById('start-overlay').classList.add('hidden');
            
            // 初始化音效
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const b = audioCtx.createBuffer(1, 1, 22050);
                const s = audioCtx.createBufferSource();
                s.buffer = b; s.connect(audioCtx.destination); s.start(0);
            } catch(e) {}

            const urlParams = new URLSearchParams(window.location.search);
            const className = urlParams.get('class');
            if (!className) { document.getElementById('class-title').innerText = "錯誤：未指定班級"; return; }

            document.getElementById('class-title').innerText = `${className} 班即時看板`;
            classQueueRef = database.ref(`queues/${className}`);

            // 監聽新增
            const startTime = new Date().toISOString();
            classQueueRef.orderByChild('timestamp').startAt(startTime).on('child_added', (snapshot) => {
                const data = snapshot.val(); data.key = snapshot.key;
                // 防止重複
                if (!studentQueue.some(s => s.id === data.id)) {
                    studentQueue.push(data);
                    updateDisplay();
                    playNotificationSound();
                }
            });

            // 監聽刪除
            classQueueRef.on('child_removed', (snapshot) => {
                studentQueue = studentQueue.filter(s => s.key !== snapshot.key);
                updateDisplay();
            });
            
            updateDisplay();
        }
    </script>
</body>
</html>
