<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級老師即時看板 (中英雙語版)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { 
            font-family: 'Microsoft JhengHei', Arial, sans-serif; 
            background-color: #f0f8ff; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; margin: 0; padding: 10px; color: #333; 
            box-sizing: border-box;
        }
        
        #connection-status {
            position: fixed; top: 10px; right: 10px;
            padding: 8px 15px; border-radius: 50px;
            font-size: 0.9rem; font-weight: bold;
            color: #333; background-color: #ccc; 
            z-index: 200; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header { text-align: center; margin-bottom: 20px; margin-top: 30px; }
        .header h1 { margin: 0; font-size: 2em; color: #2c3e50; }
        .header p { color: #7f8c8d; font-size: 1em; margin-top: 5px; }

        #queue-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 15px; }

        .student-card {
            background: white; padding: 15px 20px; border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; 
            border-left: 8px solid #3498db; 
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .info { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .info h2 { margin: 0; font-size: 1.8em; color: #2c3e50; }
        .info .time { color: #95a5a6; font-size: 0.9em; }

        .actions { display: flex; gap: 8px; width: 100%; }
        .btn { border: none; padding: 10px 2px; border-radius: 6px; font-size: 0.9em; cursor: pointer; color: white; font-weight: bold; flex: 1; line-height: 1.2; }
        .btn:active { transform: scale(0.95); }
        .btn-1 { background: #2ecc71; } .btn-2 { background: #f39c12; } .btn-3 { background: #3498db; } .btn-4 { background: #e74c3c; }

        .empty-state { text-align: center; margin-top: 80px; color: #bdc3c7; }
        .empty-state i { font-size: 5em; display: block; margin-bottom: 20px; font-style: normal; }
        
        /* 啟動音效遮罩 */
        #audio-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 999;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        #audio-overlay div {
            background: white; padding: 30px; border-radius: 15px;
            font-size: 1.5em; font-weight: bold; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="audio-overlay" onclick="startSystem()">
        <div>👆 點擊畫面開始 (Start System)</div>
    </div>

    <div id="connection-status">連線初始化...</div>

    <div class="header">
        <h1>班級即時看板</h1>
        <p>等待家長接送通知...</p>
        <button onclick="playDingDong()" style="margin-top:10px; padding:5px 15px; border-radius:20px; border:1px solid #ccc; background:white; cursor:pointer;">🔔 測試音效</button>
    </div>

    <div id="queue-container"></div>
    <div id="empty-state" class="empty-state" style="display:none">
        <i>⌛️</i>
        <h2>目前沒有通知</h2>
    </div>

    <script>
        let audioCtx = null;
        
        function startSystem() {
            document.getElementById('audio-overlay').style.display = 'none';
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                    audioCtx.resume().then(() => {
                        console.log("音效引擎啟動");

                    });
                }
            } catch (e) {
                console.warn("音效啟動失敗", e);
            }
        }

        // --- 柔和版叮咚聲 (合成音效，無雜訊) ---
        function playDingDong() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            // 第一聲 (Mi - 329Hz)
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine'; 
            osc1.frequency.setValueAtTime(329.63, now); 
            gain1.gain.setValueAtTime(0, now); 
            gain1.gain.linearRampToValueAtTime(0.5, now + 0.1); 
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 1.2); 
            osc1.connect(gain1); gain1.connect(audioCtx.destination);
            osc1.start(now); osc1.stop(now + 1.2);

            // 第二聲 (Do - 261Hz)
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(261.63, now + 0.8); 
            gain2.gain.setValueAtTime(0, now + 0.8);
            gain2.gain.linearRampToValueAtTime(0.5, now + 0.9);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
            osc2.connect(gain2); gain2.connect(audioCtx.destination);
            osc2.start(now + 0.8); osc2.stop(now + 2.5);
        }

        // --- ★★★ 核心修正：中英雙語廣播 ★★★ ---
        function speak(name) {
            if ('speechSynthesis' in window) {
                const synth = window.speechSynthesis;
                synth.cancel(); // 停止之前的語音

                // 1. 中文 (含名字)
                // "王小明同學，家長來接囉"
                const u1 = new SpeechSynthesisUtterance(`${name}同學，家長來接囉`);
                u1.lang = 'zh-TW';
                u1.rate = 1;

                // 2. 英文
                // "Hi! Student, your parent is here"
                // 這裡我們直接把名字拼音放進去，雖然讀音可能不完美，但外籍老師聽得懂
                const u2 = new SpeechSynthesisUtterance(`Hi! Student , your parent is here.`);
                u2.lang = 'en-US';
                u2.rate = 0.9;

                // 依序排隊播放
                synth.speak(u1);
                
                // 加一點點停頓
                const pause = new SpeechSynthesisUtterance('');
                pause.text = ' '; pause.pause = 0.5;
                synth.speak(pause);
                
                synth.speak(u2);
            }
        }

        // --- 主程式 ---
        const firebaseConfig = {
            apiKey: "AIzaSyB_-fHCMhi-URwyBqzAIipmffWwvNgzJJc",
            authDomain: "qr-scanner-app-2c73d.firebaseapp.com",
            databaseURL: "https://qr-scanner-app-2c73d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "qr-scanner-app-2c73d",
            storageBucket: "qr-scanner-app-2c73d.firebasestorage.app",
            messagingSenderId: "385628927398",
            appId: "1:385628927398:web:00239f1b2acebd6e790b67"
        };
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZHGM5xMgNFn9Df6BXMVfSesT3BIfHN91NdZjLK5TkHdEOai476VNIlJaw61n3Bxg9CA/exec";

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const alertsRef = database.ref("alerts");
        let studentQueue = [];
        let classQueueRef = null;
        
        const urlParams = new URLSearchParams(window.location.search);
        const className = urlParams.get('class');

        database.ref(".info/connected").on("value", (snap) => {
            const statusEl = document.getElementById('connection-status');
            if (snap.val() === true) {
                statusEl.innerText = "🟢 連線正常";
                statusEl.style.backgroundColor = "#27ae60";
                statusEl.style.color = "white";
            } else {
                statusEl.innerText = "🔴 断線重連中";
                statusEl.style.backgroundColor = "#e74c3c";
                statusEl.style.color = "white";
            }
        });

        if (!className) {
            document.querySelector('.header p').innerText = "請在網址後加上 ?class=1A";
        } else {
            document.querySelector('.header h1').innerText = `${className} 班即時看板`;
            classQueueRef = database.ref(`queues/${className}`);
            const startTime = new Date(Date.now() - 12 * 60 * 60 * 1000).toISOString();

            classQueueRef.orderByChild('timestamp').startAt(startTime).on('child_added', (snapshot) => {
                const data = snapshot.val();
                data.key = snapshot.key;

                // 檢查是否重複 (1分鐘內)
                const sameStudentEntries = studentQueue.filter(s => s.id === data.id);
                let shouldAdd = true;
                if (sameStudentEntries.length > 0) {
                    const lastEntry = sameStudentEntries[sameStudentEntries.length - 1];
                    const lastTime = new Date(lastEntry.timestamp).getTime();
                    const newTime = new Date(data.timestamp).getTime();
                    if (newTime - lastTime < 60000) shouldAdd = false;
                }

                if (shouldAdd) {
                    studentQueue.push(data);
                    updateDisplay();
                    
                    // 1. 叮咚 (無爆音)
                    playDingDong();
                    
                    // 2. 延遲後開始雙語播報
                    // 延遲是為了讓叮咚聲先播完，避免聲音打架
                    setTimeout(() => {
                        speak(data.name);
                    }, 1500);
                }
            });

            classQueueRef.on('child_removed', (snapshot) => {
                studentQueue = studentQueue.filter(s => s.key !== snapshot.key);
                updateDisplay();
            });
        }

        function updateDisplay() {
            const container = document.getElementById('queue-container');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = '';

            if (studentQueue.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            studentQueue.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            studentQueue.forEach(s => {
                const card = document.createElement('div');
                card.className = 'student-card';
                const sClass = s.class || className || "未分班";
                
                card.innerHTML = `
                    <div class="info">
                        <h2>${s.name}</h2>
                        <div class="time">掃描: ${new Date(s.timestamp).toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'})}</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-1" onclick="handleResponse('${s.key}', '${s.name}', '${sClass}', '收拾書包前往警衛室')">📗<br>收拾書包</button>
                        <button class="btn btn-2" onclick="handleResponse('${s.key}', '${s.name}', '${sClass}', '上廁所請稍候')">🚽<br>上廁所</button>
                        <button class="btn btn-3" onclick="handleResponse('${s.key}', '${s.name}', '${sClass}', '班級在室外活動')">⚽️<br>室外活動</button>
                        <button class="btn btn-4" onclick="handleResponse('${s.key}', '${s.name}', '${sClass}', '老師另外連絡家長')">📲<br>另約家長</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.handleResponse = function(key, name, sClass, responseText) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ type: 'reply', studentName: name, response: responseText })
            }).catch(e => console.error(e));
            
            alertsRef.push({
                name: name, class: sClass, status: responseText, timestamp: new Date().toISOString()
            });
            
            if (classQueueRef) classQueueRef.child(key).remove();
        };
    </script>
</body>
</html>
