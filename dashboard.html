<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>永順國小課後照顧早接系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* --- 全域設定 --- */
        body { 
            font-family: 'Press Start 2P', cursive; /* 像素字體 */
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            /* 經典的泥土背景紋理 (CSS 模擬) */
            background-color: #382618;
            background-image: 
                linear-gradient(45deg, #2b1d12 25%, transparent 25%, transparent 75%, #2b1d12 75%, #2b1d12),
                linear-gradient(45deg, #2b1d12 25%, transparent 25%, transparent 75%, #2b1d12 75%, #2b1d12);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: #fff;
        }

        /* --- 標題區 --- */
        .logo-area {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }

        h1 {
            font-size: 2em;
            color: #fff;
            text-shadow: 4px 4px 0 #3f3f3f; /* 標題陰影 */
            margin-bottom: 10px;
            line-height: 1.5;
        }

        /* 模仿 Minecraft 主畫面的黃色閃爍標語 (Splash Text) */
        .splash-text {
            color: #ffff55;
            font-size: 0.8em;
            text-shadow: 2px 2px 0 #3f3f3f;
            transform: rotate(-10deg);
            animation: pulse 1s infinite alternate;
            display: inline-block;
        }

        @keyframes pulse {
            from { transform: scale(1) rotate(-10deg); }
            to { transform: scale(1.1) rotate(-10deg); }
        }

        /* --- 選單容器 --- */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 50px;
        }

        /* --- Minecraft 風格按鈕 (方塊) --- */
        .mc-btn {
            display: block;
            text-decoration: none;
            color: white;
            text-align: center;
            position: relative;
            padding: 4px; /* 模擬邊框厚度 */
            background: #000; /* 最外層黑框 */
            transition: transform 0.1s;
        }

        .mc-btn:active {
            transform: translateY(4px); /* 按下效果 */
        }

        /* 按鈕內部內容 */
        .btn-inner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 180px;
            border: 4px solid rgba(255,255,255,0.2); /* 內發光 */
            position: relative;
            /* 預設石頭材質 */
            background-color: #757575; 
            box-shadow: inset -4px -4px 0 rgba(0,0,0,0.4), inset 4px 4px 0 rgba(255,255,255,0.4);
        }

        .icon {
            font-size: 3em;
            margin-bottom: 15px;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.5);
        }

        .btn-title {
            font-size: 1.2em;
            text-shadow: 2px 2px 0 #000;
            line-height: 1.5;
        }

        .btn-desc {
            font-size: 0.6em;
            color: #ddd;
            margin-top: 10px;
            text-shadow: 1px 1px 0 #000;
            font-family: Arial, sans-serif; /* 說明文字用回普通字體比較好讀 */
        }

        /* --- 個別按鈕配色 (材質包) --- */

        /* 1. 掃描站 (草方塊風格) */
        .mc-btn.scanner .btn-inner {
            background-color: #588134; /* 綠色 */
            background-image: linear-gradient(180deg, #70a638 50%, #513e27 50%);
        }
        .mc-btn.scanner:hover .btn-inner {
            filter: brightness(1.1);
        }

        /* 2. 警衛室 (金磚/火把風格 - 橘黃色) */
        .mc-btn.guard .btn-inner {
            background-color: #ff9800;
            box-shadow: inset -4px -4px 0 #b35900, inset 4px 4px 0 #ffcc80;
        }
        .mc-btn.guard:hover .btn-inner {
            filter: brightness(1.1);
        }

        /* 3. 班級目錄 (鑽石風格 - 青藍色) */
        .mc-btn.teacher .btn-inner {
            background-color: #42a5f5;
            box-shadow: inset -4px -4px 0 #0d47a1, inset 4px 4px 0 #90caf9;
        }
        .mc-btn.teacher:hover .btn-inner {
            filter: brightness(1.1);
        }

        /* --- 後台管理區 (基岩風格) --- */
        .admin-section {
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 4px dashed #555;
        }

        .mc-btn-small {
            display: inline-block;
            text-decoration: none;
            background-color: #333; /* 基岩黑 */
            padding: 4px;
            background: #000;
        }

        .mc-btn-small .btn-inner-small {
            background-color: #3a3a3a; /* 深灰 */
            color: #ff5555; /* 紅字 */
            padding: 15px 30px;
            font-size: 0.8em;
            box-shadow: inset -3px -3px 0 #1a1a1a, inset 3px 3px 0 #555;
            text-shadow: 2px 2px 0 #000;
        }
        
        .mc-btn-small:active { transform: translateY(4px); }
        .mc-btn-small:hover .btn-inner-small { background-color: #4a4a4a; }

        /* RWD 調整 */
        @media (max-width: 600px) {
            h1 { font-size: 1.5em; }
            .menu-container { grid-template-columns: 1fr; }
        }

    </style>
</head>
<body>

    <div class="logo-area">
        <h1>MINECRAFT<br>PICKUP SYSTEM</h1>
        <div class="splash-text">System Active!</div>
    </div>

    <div class="menu-container">
        
        <a href="index.html" class="mc-btn scanner" target="_blank">
            <div class="btn-inner">
                <div class="icon">📷</div>
                <div class="btn-title">SCANNER<br>家長掃描</div>
                <div class="btn-desc">Click to Scan QR Code</div>
            </div>
        </a>

        <a href="view.html" class="mc-btn guard" target="_blank">
            <div class="btn-inner">
                <div class="icon">🛡️</div>
                <div class="btn-title">GUARD<br>警衛看板</div>
                <div class="btn-desc">Monitor Pickup Status</div>
            </div>
        </a>

        <a href="directory.html" class="mc-btn teacher" target="_blank">
            <div class="btn-inner">
                <div class="icon">💎</div>
                <div class="btn-title">CLASSROOM<br>班級入口</div>
                <div class="btn-desc">For Teachers Only</div>
            </div>
        </a>

    </div>

    <div class="admin-section">
        <p style="font-size: 0.6em; color: #aaa; margin-bottom: 15px;">SERVER SETTINGS</p>
        <a href="management.html" class="mc-btn-small" target="_blank">
            <div class="btn-inner-small">
                🧨 ADMIN (RESET DB)
            </div>
        </a>
    </div>

</body>
</html>
