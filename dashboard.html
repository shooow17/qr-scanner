<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>永順國小課後照顧早接系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 參考圖片的配色 */
            --mc-green: #70B237;       /* 草方塊綠 */
            --mc-brown: #593D29;       /* 泥土棕 */
            --mc-bg: #DCCFA3;          /* 沙灘背景色 */
            --mc-border: #1D1D1D;      /* 深黑色邊框 */
            
            /* 模擬像素質感的內陰影 */
            --inset-light: inset 4px 4px 0 rgba(255,255,255,0.25);
            --inset-dark: inset -4px -4px 0 rgba(0,0,0,0.25);
        }

        body { 
            margin: 0; 
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            
            /* 背景：沙灘色 + 像素雜點 */
            background-color: var(--mc-bg);
            background-image: 
                radial-gradient(#C6B68D 15%, transparent 16%),
                radial-gradient(#C6B68D 15%, transparent 16%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* --- 標題區 --- */
        .logo-area {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2em;
            color: #333;
            text-shadow: 4px 4px 0 #fff;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .splash-text {
            font-family: 'Press Start 2P', cursive;
            color: #FF5555;
            font-size: 0.9em;
            text-shadow: 2px 2px 0 #fff;
            transform: rotate(-8deg);
            animation: pulse 0.8s infinite alternate;
            display: inline-block;
            background: #fff;
            padding: 5px 10px;
            border: 2px solid #333;
        }

        @keyframes pulse {
            from { transform: scale(1) rotate(-8deg); }
            to { transform: scale(1.1) rotate(-8deg); }
        }

        /* --- 選單容器 --- */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 60px;
        }

        /* --- [核心] 2D 像素卡片按鈕 --- */
        .mc-card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            position: relative;
            
            /* 最外層粗框 */
            border: 4px solid var(--mc-border);
            background-color: var(--mc-border); /* 填補縫隙 */
            
            /* 陰影增加層次感 */
            box-shadow: 6px 6px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .mc-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 rgba(0,0,0,0.25);
            filter: brightness(1.05);
        }

        .mc-card:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        /* 上半部：綠色區 (放圖示) */
        .card-top {
            background-color: var(--mc-green);
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--inset-light), var(--inset-dark); /* 內發光質感 */
            border-bottom: 4px solid rgba(0,0,0,0.1); /* 分隔線 */
        }

        .pixel-icon {
            font-size: 4.5em;
            /* 讓 Emoji 也有像素邊框感 */
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.3));
        }

        /* 下半部：棕色區 (放文字) */
        .card-bottom {
            background-color: var(--mc-brown);
            padding: 20px 10px;
            text-align: center;
            box-shadow: var(--inset-light), var(--inset-dark);
            color: #fff;
        }

        .en-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2em;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-shadow: 3px 3px 0 #000; /* 黑色硬陰影 */
            text-transform: uppercase;
        }

        .zh-title {
            font-size: 1.6em;
            font-weight: 900; /* 最粗體 */
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 2px;
        }

        .desc-text {
            font-size: 0.9em;
            color: #ccc;
            margin-top: 5px;
            font-weight: normal;
            text-shadow: 1px 1px 0 #000;
        }

        /* --- 後台管理 (基岩灰風格) --- */
        .admin-section {
            width: 100%;
            text-align: center;
            border-top: 4px dashed #998A70; /* 沙色虛線 */
            padding-top: 30px;
        }

        .admin-btn {
            display: inline-block;
            text-decoration: none;
            border: 4px solid var(--mc-border);
            background-color: #333; /* 深灰 */
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            transition: all 0.1s;
        }

        .admin-btn-inner {
            padding: 15px 30px;
            color: #FF6666; /* 紅色字 */
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8em;
            box-shadow: inset 3px 3px 0 #555, inset -3px -3px 0 #111;
            text-shadow: 2px 2px 0 #000;
        }

        .admin-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 rgba(0,0,0,0.25);
        }
        .admin-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        /* RWD */
        @media (max-width: 600px) {
            h1 { font-size: 1.4em; }
            .menu-container { grid-template-columns: 1fr; }
            .card-top { height: 140px; }
        }

    </style>
</head>
<body>

    <div class="logo-area">
        <h1>永順國小課後照顧早接系統</h1>
        <div class="splash-text">System Active!</div>
    </div>

    <div class="menu-container">
        
        <a href="index.html" class="mc-card" target="_blank">
            <div class="card-top">
                <div class="pixel-icon">📷</div>
            </div>
            <div class="card-bottom">
                <div class="en-title">SCANNER</div>
                <div class="zh-title">家長掃描站</div>
                <div class="desc-text">Click to Scan</div>
            </div>
        </a>

        <a href="view.html" class="mc-card" target="_blank">
            <div class="card-top">
                <div class="pixel-icon">🛡️</div>
            </div>
            <div class="card-bottom">
                <div class="en-title">GUARD VIEW</div>
                <div class="zh-title">警衛室看板</div>
                <div class="desc-text">Monitor Status</div>
            </div>
        </a>

        <a href="directory.html" class="mc-card" target="_blank">
            <div class="card-top">
                <div class="pixel-icon">💎</div>
            </div>
            <div class="card-bottom">
                <div class="en-title">CLASSROOM</div>
                <div class="zh-title">各班教室入口</div>
                <div class="desc-text">Teacher Only</div>
            </div>
        </a>

    </div>

    <div class="admin-section">
        <a href="management.html" class="admin-btn" target="_blank">
            <div class="admin-btn-inner">
                ⚙️ ADMIN (RESET DB)
            </div>
        </a>
    </div>

</body>
</html>
