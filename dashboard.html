<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麥塊校園接送系統 - 主控台</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* --- 全域設定 --- */
        body { 
            font-family: 'Press Start 2P', cursive; /* 像素字體 */
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            /* 經典的泥土背景紋理 */
            background-color: #382618;
            background-image: 
                linear-gradient(45deg, #2b1d12 25%, transparent 25%, transparent 75%, #2b1d12 75%, #2b1d12),
                linear-gradient(45deg, #2b1d12 25%, transparent 25%, transparent 75%, #2b1d12 75%, #2b1d12);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: #fff;
        }

        /* --- 標題區 (中文化) --- */
        .logo-area {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }

        h1 {
            font-size: 2em;
            color: #fff;
            text-shadow: 4px 4px 0 #3f3f3f;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        /* 黃色閃爍標語 (Splash Text) */
        .splash-text {
            color: #ffff55;
            font-size: 1em;
            text-shadow: 2px 2px 0 #3f3f3f;
            transform: rotate(-8deg);
            animation: pulse 0.8s infinite alternate;
            display: inline-block;
        }

        @keyframes pulse {
            from { transform: scale(1) rotate(-8deg); }
            to { transform: scale(1.1) rotate(-8deg); }
        }

        /* --- 選單容器 --- */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 50px;
        }

        /* --- Minecraft 風格按鈕外框 --- */
        .mc-btn {
            display: block;
            text-decoration: none;
            color: white;
            text-align: center;
            position: relative;
            padding: 4px; /* 最外層黑框厚度 */
            background: #000; 
            transition: transform 0.1s;
        }

        .mc-btn:active {
            transform: translateY(6px); /* 按下效果 */
        }

        /* --- [核心修改] 按鈕內部：統一的草方塊樣式 --- */
        .btn-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 220px; /* 增加高度以容納分層 */
            position: relative;
            
            /* 草方塊材質：使用硬邊漸層模擬上綠下棕 */
            background: linear-gradient(
                to bottom, 
                #7cb342 0%, #7cb342 55%,  /* 上半部綠色 */
                #5d4037 55%, #5d4037 100% /* 下半部棕色 */
            );
            
            /* 像素風格邊框與內發光 */
            border: 4px solid #3E2723; /* 深棕色邊框 */
            box-shadow: 
                inset 4px 4px 0 rgba(255,255,255,0.3), /* 左上高光 */
                inset -4px -4px 0 rgba(0,0,0,0.3); /* 右下陰影 */
            
            padding-top: 25px;
        }

        /* 圖示容器 (深色背景框) */
        .icon-container {
            background-color: rgba(0,0,0,0.6);
            border: 3px solid #222;
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 10px;
            box-shadow: inset 0 0 10px #000;
        }

        .icon {
            font-size: 3em;
            margin-bottom: 0;
            filter: drop-shadow(2px 2px 0 #000);
        }

        /* 文字區域 */
        .text-container {
            margin-top: auto; /* 將文字推到下方棕色區域 */
            padding-bottom: 20px;
        }

        .btn-title {
            font-size: 1.3em;
            text-shadow: 3px 3px 0 #000;
            line-height: 1.4;
            font-weight: bold;
        }

        .btn-desc {
            font-size: 0.7em;
            color: #ddd;
            margin-top: 8px;
            text-shadow: 1px 1px 0 #000;
            font-family: Arial, sans-serif; /* 說明文字維持易讀字體 */
            opacity: 0.9;
        }

        /* --- 後台管理區 (維持基岩風格以示區別) --- */
        .admin-section {
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 4px dashed #555;
        }

        .mc-btn-small {
            display: inline-block;
            text-decoration: none;
            background-color: #333;
            padding: 4px;
            background: #000;
        }

        .mc-btn-small .btn-inner-small {
            background-color: #2a2a2a; /* 深灰基岩 */
            color: #ff5555; /* 紅色警告字 */
            padding: 15px 30px;
            font-size: 0.8em;
            border: 3px solid #1a1a1a;
            box-shadow: inset 3px 3px 0 #444, inset -3px -3px 0 #000;
            text-shadow: 2px 2px 0 #000;
        }
        
        .mc-btn-small:active { transform: translateY(4px); }
        .mc-btn-small:hover .btn-inner-small { background-color: #3a3a3a; }

        /* RWD 調整 */
        @media (max-width: 600px) {
            h1 { font-size: 1.5em; }
            .menu-container { grid-template-columns: 1fr; }
            .btn-inner { height: 200px; }
        }

    </style>
</head>
<body>

    <div class="logo-area">
        <h1>麥塊校園接送系統</h1>
        <div class="splash-text">系統運作中！</div>
    </div>

    <div class="menu-container">
        
        <a href="index.html" class="mc-btn" target="_blank">
            <div class="btn-inner">
                <div class="icon-container">
                    <div class="icon">📷</div>
                </div>
                <div class="text-container">
                    <div class="btn-title">家長掃描站</div>
                    <div class="btn-desc">SCANNER</div>
                </div>
            </div>
        </a>

        <a href="view.html" class="mc-btn" target="_blank">
            <div class="btn-inner">
                <div class="icon-container">
                    <div class="icon">🛡️</div>
                </div>
                <div class="text-container">
                    <div class="btn-title">警衛室看板</div>
                    <div class="btn-desc">GUARD VIEW</div>
                </div>
            </div>
        </a>

        <a href="directory.html" class="mc-btn" target="_blank">
            <div class="btn-inner">
                <div class="icon-container">
                    <div class="icon">💎</div>
                </div>
                <div class="text-container">
                    <div class="btn-title">各班教室入口</div>
                    <div class="btn-desc">CLASSROOMS</div>
                </div>
            </div>
        </a>

    </div>

    <div class="admin-section">
        <p style="font-size: 0.6em; color: #aaa; margin-bottom: 15px; font-family: Arial;">SERVER ADMIN</p>
        <a href="management.html" class="mc-btn-small" target="_blank">
            <div class="btn-inner-small">
                🧨 進入後台 (清空資料庫)
            </div>
        </a>
    </div>

</body>
</html>
