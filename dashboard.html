<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>永順國小課後照顧碼上接回家系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* --- 活躍功能 (草方塊) --- */
            --mc-green: #70B237;       /* 草方塊綠 */
            --mc-brown: #593D29;       /* 泥土棕 */
            
            /* --- [新增] 開發中功能 (石頭) --- */
            --mc-stone-light: #9E9E9E; /* 石頭亮面 (灰色) */
            --mc-stone-dark: #424242;  /* 石頭暗面 (深灰) */

            /* --- 全域設定 --- */
            --mc-bg: #DCCFA3;          /* 沙灘背景色 */
            --mc-border: #1D1D1D;      /* 深黑色邊框 */
            
            /* 模擬像素質感的內陰影 */
            --inset-light: inset 4px 4px 0 rgba(255,255,255,0.25);
            --inset-dark: inset -4px -4px 0 rgba(0,0,0,0.25);
        }

        body { 
            margin: 0; 
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            
            /* 背景：沙灘色 + 像素雜點 */
            background-color: var(--mc-bg);
            background-image: 
                radial-gradient(#C6B68D 15%, transparent 16%),
                radial-gradient(#C6B68D 15%, transparent 16%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* --- 標題區 --- */
        .logo-area {
            text-align: center;
            margin-bottom: 50px; 
        }

        h1 {
            font-family: 'Press Start 2P', 'Noto Sans TC', sans-serif;
            font-weight: 900;
            font-size: 3.5em;
            color: #EEEEEE;
            text-shadow: 
                5px 5px 0 #000,
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000;
            margin-bottom: 0;
            line-height: 1.4;
            letter-spacing: -2px;
            word-break: keep-all; 
        }

        .highlight-text {
            color: #FFD700;
            font-size: 1.4em;
            margin: 0 5px;
            text-shadow: 
                6px 6px 0 #000,
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000;
        }

        /* --- 選單容器 --- */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 欄 */
            gap: 30px; 
            width: 95%;
            max-width: 1400px;
            margin-bottom: 60px;
        }

        /* --- [核心] 2D 像素卡片按鈕 --- */
        .mc-card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            position: relative;
            border: 4px solid var(--mc-border);
            background-color: var(--mc-border);
            box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        /* 預設 (綠色) 互動效果 */
        .mc-card:not(.gray):hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0 rgba(0,0,0,0.3);
            filter: brightness(1.1);
        }
        .mc-card:not(.gray):active {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
        }

        /* --- 卡片上半部 (圖示區) --- */
        .card-top {
            background-color: var(--mc-green); /* 預設綠色 */
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--inset-light), var(--inset-dark);
            border-bottom: 4px solid rgba(0,0,0,0.1);
        }

        .pixel-icon {
            font-size: 5em;
            filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.4));
        }

        /* --- 卡片下半部 (文字區) --- */
        .card-bottom {
            background-color: var(--mc-brown); /* 預設棕色 */
            padding: 25px 10px;
            text-align: center;
            box-shadow: var(--inset-light), var(--inset-dark);
            color: #fff;
            flex-grow: 1; /* 確保高度一致 */
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* 文字靠上 */
        }

        /* --- [新增] 灰色卡片樣式 (開發中) --- */
        .mc-card.gray .card-top {
            background-color: var(--mc-stone-light); /* 淺灰 */
        }
        .mc-card.gray .card-bottom {
            background-color: var(--mc-stone-dark); /* 深灰 */
        }
        /* 灰色卡片的互動效果 (比較沉重) */
        .mc-card.gray {
            cursor: not-allowed; /* 禁止符號 */
        }
        .mc-card.gray:hover {
            transform: none; /* 不浮動 */
            filter: grayscale(0.5); /* 稍微變暗 */
        }

        /* --- 文字排版 --- */
        .en-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.1em; /* 稍微縮小以容納長單字 */
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #000;
            text-transform: uppercase;
            min-height: 1.2em; /* 保持高度 */
        }

        .zh-title {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1.6em; /* 稍微縮小 */
            font-weight: 900;
            text-shadow: 3px 3px 0 #000;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .desc-text {
            font-size: 0.85em;
            color: #ddd;
            margin-top: 8px;
            font-weight: normal;
            text-shadow: 2px 2px 0 #000;
            line-height: 1.4;
        }

        /* --- 後台管理 --- */
        .admin-section {
            width: 100%;
            text-align: center;
            border-top: 4px dashed #998A70;
            padding-top: 40px;
        }

        .admin-btn {
            display: inline-block;
            text-decoration: none;
            border: 4px solid var(--mc-border);
            background-color: #333;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.3);
            transition: all 0.1s;
        }

        .admin-btn-inner {
            padding: 20px 40px;
            color: #FF6666;
            font-family: 'Press Start 2P', cursive;
            font-size: 1em;
            box-shadow: inset 3px 3px 0 #555, inset -3px -3px 0 #111;
            text-shadow: 2px 2px 0 #000;
        }

        .admin-btn:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 rgba(0,0,0,0.35); }
        .admin-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0,0,0,0.3); }

        /* RWD */
        @media (max-width: 1200px) {
            .menu-container { gap: 15px; }
            .card-top { height: 150px; }
            .pixel-icon { font-size: 3.5em; }
            .zh-title { font-size: 1.4em; }
            .en-title { font-size: 0.9em; }
            .desc-text { font-size: 0.75em; }
            h1 { font-size: 2.5em; } 
            .highlight-text { font-size: 1.3em; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .highlight-text { font-size: 1.3em; }
            /* 手機板切為單欄 */
            .menu-container { grid-template-columns: 1fr; max-width: 400px; gap: 30px; }
            .card-top { height: 180px; }
            .pixel-icon { font-size: 5em; }
            .zh-title { font-size: 1.8em; }
            .en-title { font-size: 1.2em; }
        }

    </style>
</head>
<body>

    <div class="logo-area">
        <h1>永順國小課後照顧<span class="highlight-text">碼上接</span>回家系統</h1>
    </div>

    <div class="menu-container">
        
        <a href="view.html" class="mc-card" target="_blank">
            <div class="card-top"><div class="pixel-icon">🖥️</div></div>
            <div class="card-bottom">
                <div class="en-title">SCAN & VIEW</div>
                <div class="zh-title">掃描監看大廳</div>
                <div class="desc-text">掃描與警衛狀態</div>
            </div>
        </a>

        <a href="directory.html" class="mc-card" target="_blank">
            <div class="card-top"><div class="pixel-icon">👨‍🏫</div></div>
            <div class="card-bottom">
                <div class="en-title">CLASSROOM</div>
                <div class="zh-title">各班教室入口</div>
                <div class="desc-text">Teacher Only</div>
            </div>
        </a>

        <a href="generator.html" class="mc-card" target="_blank">
            <div class="card-top"><div class="pixel-icon">🖨️</div></div>
            <div class="card-bottom">
                <div class="en-title">GENERATOR</div>
                <div class="zh-title">QR碼產生器</div>
                <div class="desc-text">Create Codes</div>
            </div>
        </a>

        <a href="javascript:void(0)" class="mc-card gray" onclick="alert('【家長系統】開發中，敬請期待！\n功能：申請入班、繳費')">
            <div class="card-top"><div class="pixel-icon">👨‍👩‍👧‍👦</div></div>
            <div class="card-bottom">
                <div class="en-title">PARENTS</div>
                <div class="zh-title">家長系統</div>
                <div class="desc-text">申請入班 • 繳費</div>
            </div>
        </a>

        <a href="javascript:void(0)" class="mc-card gray" onclick="alert('【學生管理】開發中，敬請期待！\n功能：編班、學生查詢')">
            <div class="card-top"><div class="pixel-icon">🗃️</div></div>
            <div class="card-bottom">
                <div class="en-title">MANAGEMENT</div>
                <div class="zh-title">學生管理</div>
                <div class="desc-text">編班 • 學生查詢</div>
            </div>
        </a>

        <a href="javascript:void(0)" class="mc-card gray" onclick="alert('【繳費系統】開發中，敬請期待！\n功能：製作繳費單、對帳、薪資處理')">
            <div class="card-top"><div class="pixel-icon">💰</div></div>
            <div class="card-bottom">
                <div class="en-title">PAYMENT</div>
                <div class="zh-title">繳費系統</div>
                <div class="desc-text">繳費單 • 對帳 • 薪資</div>
            </div>
        </a>

        <a href="javascript:void(0)" class="mc-card gray" onclick="alert('【工作日誌系統】開發中，敬請期待！\n功能：線上點名、突發狀況紀錄')">
            <div class="card-top"><div class="pixel-icon">📝</div></div>
            <div class="card-bottom">
                <div class="en-title">WORK LOG</div>
                <div class="zh-title">工作日誌</div>
                <div class="desc-text">點名 • 事件紀錄</div>
            </div>
        </a>

    </div>

    <div class="admin-section">
        <a href="management.html" class="admin-btn" target="_blank">
            <div class="admin-btn-inner">
                ⚙️ 管理介面 (RESET DB)
            </div>
        </a>
    </div>

</body>
</html>
