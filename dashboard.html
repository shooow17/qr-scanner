<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>永順國小課後照顧碼上接回家系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 參考圖片的配色 */
            --mc-green: #70B237;       /* 草方塊綠 */
            --mc-brown: #593D29;       /* 泥土棕 */
            --mc-bg: #DCCFA3;          /* 沙灘背景色 */
            --mc-border: #1D1D1D;      /* 深黑色邊框 */
            
            /* 模擬像素質感的內陰影 */
            --inset-light: inset 4px 4px 0 rgba(255,255,255,0.25);
            --inset-dark: inset -4px -4px 0 rgba(0,0,0,0.25);
        }

        body { 
            margin: 0; 
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            
            /* 背景：沙灘色 + 像素雜點 */
            background-color: var(--mc-bg);
            background-image: 
                radial-gradient(#C6B68D 15%, transparent 16%),
                radial-gradient(#C6B68D 15%, transparent 16%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* --- 標題區 --- */
        .logo-area {
            text-align: center;
            margin-bottom: 50px; 
        }

        h1 {
            /* 字體設定 */
            font-family: 'Press Start 2P', 'Noto Sans TC', sans-serif;
            font-weight: 900; /* 最粗體 */
            font-size: 3.5em; /* 基礎文字大小 */
            color: #EEEEEE; /* 淺灰色字 */
            
            /* 黑色硬陰影 */
            text-shadow: 
                5px 5px 0 #000,
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000;
            
            margin-bottom: 0;
            line-height: 1.4;
            letter-spacing: -2px;
            word-break: keep-all; 
        }

        /* [修改] 標題高亮文字樣式 */
        .highlight-text {
            color: #FFD700; /* 亮金色 */
            font-size: 1.4em; /* [修改] 放大 1.4 倍 */
            margin: 0 5px; /* [修改] 增加一點左右間距，避免太擠 */
            
            /* 確保高亮字也有強烈的像素邊框 */
            text-shadow: 
                6px 6px 0 #000, /* 陰影也稍微加大 */
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000;
        }

        /* --- 選單容器 --- */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 強制固定 4 欄 */
            gap: 30px; 
            width: 95%;
            max-width: 1400px;
            margin-bottom: 60px;
        }

        /* --- [核心] 2D 像素卡片按鈕 --- */
        .mc-card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            position: relative;
            
            /* 最外層粗框 */
            border: 4px solid var(--mc-border);
            background-color: var(--mc-border); /* 填補縫隙 */
            
            /* 陰影增加層次感 */
            box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .mc-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0 rgba(0,0,0,0.3);
            filter: brightness(1.1);
        }

        .mc-card:active {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
        }

        /* 上半部：綠色區 (放圖示) */
        .card-top {
            background-color: var(--mc-green);
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--inset-light), var(--inset-dark); /* 內發光質感 */
            border-bottom: 4px solid rgba(0,0,0,0.1); /* 分隔線 */
        }

        .pixel-icon {
            font-size: 5em;
            filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.4));
        }

        /* 下半部：棕色區 (放文字) */
        .card-bottom {
            background-color: var(--mc-brown);
            padding: 25px 10px;
            text-align: center;
            box-shadow: var(--inset-light), var(--inset-dark);
            color: #fff;
        }

        .en-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2em;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #000;
            text-transform: uppercase;
        }

        .zh-title {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1.8em;
            font-weight: 900;
            text-shadow: 3px 3px 0 #000;
            letter-spacing: 1px;
        }

        .desc-text {
            font-size: 0.9em;
            color: #ddd;
            margin-top: 8px;
            font-weight: normal;
            text-shadow: 2px 2px 0 #000;
        }

        /* --- 後台管理 (基岩灰風格) --- */
        .admin-section {
            width: 100%;
            text-align: center;
            border-top: 4px dashed #998A70;
            padding-top: 40px;
        }

        .admin-btn {
            display: inline-block;
            text-decoration: none;
            border: 4px solid var(--mc-border);
            background-color: #333;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.3);
            transition: all 0.1s;
        }

        .admin-btn-inner {
            padding: 20px 40px;
            color: #FF6666;
            font-family: 'Press Start 2P', cursive;
            font-size: 1em;
            box-shadow: inset 3px 3px 0 #555, inset -3px -3px 0 #111;
            text-shadow: 2px 2px 0 #000;
        }

        .admin-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 rgba(0,0,0,0.35);
        }
        .admin-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        /* RWD: 中型螢幕 (平板橫向/小筆電) */
        @media (max-width: 1200px) {
            .menu-container { gap: 15px; }
            .card-top { height: 150px; }
            .pixel-icon { font-size: 4em; }
            .card-bottom { padding: 15px 5px; }
            .zh-title { font-size: 1.5em; }
            .en-title { font-size: 1em; }
            h1 { font-size: 2.5em; } 
            .highlight-text { font-size: 1.3em; } /* 手機板高亮字稍微縮小 */
        }

        /* RWD: 手機板 */
        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .highlight-text { font-size: 1.3em; }
            .menu-container { grid-template-columns: 1fr; max-width: 400px; gap: 30px; }
            .card-top { height: 180px; }
            .pixel-icon { font-size: 5em; }
            .card-bottom { padding: 25px 10px; }
            .zh-title { font-size: 1.8em; }
            .en-title { font-size: 1.2em; }
        }

    </style>
</head>
<body>

    <div class="logo-area">
        <h1>永順國小課後照顧<span class="highlight-text">碼上接</span>回家系統</h1>
    </div>

    <div class="menu-container">
        
        <a href="index.html" class="mc-card" target="_blank">
            <div class="card-top">
                <div class="pixel-icon">📷</div>
            </div>
            <div class="card-bottom">
                <div class="en-title">SCANNER</div>
                <div class="zh-title">家長掃描站</div>
                <div class="desc-text">Click to Scan</div>
            </div>
        </a>

        <a href="view.html" class="mc-card" target="_blank">
            <div class="card-top">
                <div class="pixel-icon">🛡️</div>
            </div>
            <div class="card-bottom">
                <div class="en-title">GUARD VIEW</div>
                <div class="zh-title">警衛室看板</div>
                <div class="desc-text">Monitor Status</div>
            </div>
        </a>

        <a href="directory.html" class="mc-card" target="_blank">
            <div class="card-top">
                <div class="pixel-icon">💎</div>
            </div>
            <div class="card-bottom">
                <div class="en-title">CLASSROOM</div>
                <div class="zh-title">各班教室入口</div>
                <div class="desc-text">Teacher Only</div>
            </div>
        </a>

        <a href="generator.html" class="mc-card" target="_blank">
            <div class="card-top">
                <div class="pixel-icon">🖨️</div>
            </div>
            <div class="card-bottom">
                <div class="en-title">GENERATOR</div>
                <div class="zh-title">QR碼產生器</div>
                <div class="desc-text">Create Codes</div>
            </div>
        </a>

    </div>

    <div class="admin-section">
        <a href="management.html" class="admin-btn" target="_blank">
            <div class="admin-btn-inner">
                ⚙️ 管理介面 (RESET DB)
            </div>
        </a>
    </div>

</body>
</html>
